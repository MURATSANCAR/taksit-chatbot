config:
  topology.workers: 1
  topology.message.timeout.secs: 300
  topology.max.spout.pending: 50
  topology.kryo.register:
    - org.apache.stormcrawler.Metadata
    - org.apache.stormcrawler.persistence.Status

  # Politeness — identify as TaksitlioBot; honor robots.txt
  http.agent.name: "TaksitlioBot"
  http.agent.version: "0.1"
  http.agent.description: "Taksitlio catalog crawler (ADR-010); contact ops"
  http.agent.url: "https://example.invalid/taksitlio-bot"
  http.agent.email: "ops@example.invalid"
  http.protocol.robots: true
  fetcher.server.delay: 2.0
  fetcher.threads.number: 4
  fetcher.max.crawl.delay: 30

  urlfrontier.host: "urlfrontier"
  urlfrontier.port: 7071
  urlfrontier.max.buckets: 80
  urlfrontier.max.urls.per.bucket: 5

  sitemap.discovery: true

  parsefilters.config.file: "conf/parsefilters.json"
  urlfilters.config.file: "conf/urlfilters.json"

  # Custom indexer output (mounted volume in supervisor)
  taksitlio.feed.dir: "/feeds"
  taksitlio.feed.flush.every: 25
