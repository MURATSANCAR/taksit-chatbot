# Ops crawl registry (ADR-010) — not application hardcoding.
# Display names live here / in DB via bind script. Python code never branches on them.
#
# channel: PRODUCT | CAMPAIGN
# Seeds are starting URLs (homepage / sitemap / campaign listing). Live product rows
# appear only after StormCrawler parse succeeds — no invented prices/rates.

version: 1

defaults:
  max_urls_per_bucket: 5
  fetch_delay_seconds: 2.0
  honor_robots: true

merchants:
  - merchant_code: m-teknosa
    display_name: Teknosa
    source_code: src-m-teknosa
    channel: PRODUCT
    adapter_code: generic.json_feed.v1
    source_type: SITEMAP_JSONLD
    allowed_hosts: [www.teknosa.com, teknosa.com]
    seed_urls:
      - https://www.teknosa.com/sitemap.xml

