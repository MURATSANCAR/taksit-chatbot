    crawl_status: PLAYWRIGHT_HOMEPAGE_PARTIAL
    source_code: src-m-koctas
    seed_urls: [https://www.koctas.com.tr/]
    notes: |
      Product sitemaps public; PDP/category often Akamai Access Denied.
      Playwright can read homepage cards. Full catalog needs partner feed,
      residential proxy, or Apify actor (caulleonard/koctas-product-scraper).

  - merchant_code: m-arcelik
    display_name: Arçelik
    verification: [PUBLIC_BANK_PAGE]
    crawl_status: CURL_CFFI_SITEMAP
    source_code: src-m-arcelik
    seed_urls: [https://www.arcelik.com.tr/, https://www.arcelik.com.tr/sitemap.xml]
    notes: |
      Akamai blocks plain HTTP/crawl4ai on -c- category URLs.
      Bypass: curl_cffi chrome TLS impersonation → PRODUCT-tr-TRY sitemap (~5.4k).
      python scripts/fetch_live_merchant_feeds.py --merchants arcelik --delay 0.2 --workers 6 --limit 0

  - merchant_code: m-beko
    display_name: Beko
    verification: [PUBLIC_BANK_PAGE]
