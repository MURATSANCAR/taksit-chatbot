# Publicly verified alışveriş-kredisi / Taksitlio-adjacent partners.
#
# Fibabanka annual report: "60+ brands / 10k+ points" — NAMED roster is NOT on
# the open web (Taksitlio mobile app / partner CRM). Entries below are only from
# public bank/merchant pages. Do NOT mark unverified brands as Taksitlio partners.
#
# verification:
#   PUBLIC_BANK_PAGE — listed on a bank alışveriş kredisi page
#   PUBLIC_MERCHANT_PAGE — merchant page mentions Fibabanka/Taksitlio/Alışgidiş
#   PRESS — named in press with Taksitlio/Alışgidiş context
#   PENDING_OFFICIAL_EXPORT — slot reserved until ops provides official list

version: 2
official_claim:
  source: "Fibabanka 2025 faaliyet raporu / basın"
  brands_claimed: "60+"
  points_claimed: "10000+"
  named_public_roster: false

merchants_verified_public:
  - merchant_code: m-teknosa
    display_name: Teknosa
    verification: [PUBLIC_MERCHANT_PAGE, PRESS]
    crawl_status: CLOUDSCRAPER_SITEMAP
    source_code: src-m-teknosa
    seed_urls: [https://www.teknosa.com/, https://www.teknosa.com/siteharitasi.xml]
    notes: |
      Cloudflare blocks plain HTTP/datacenter. Use cloudscraper:
      pip install '.[crawler]'
      python scripts/fetch_live_merchant_feeds.py --merchants teknosa --delay 0.3 --workers 6 --limit 0
      Catalog ~380k PDP URLs (Product + Outlet sitemaps). Resumes + checkpoints.

