ops_blocker: |
  To reach the claimed 60+ Taksitlio brands with prod-quality data, export the
  official partner roster (merchant_code, legal_name, seed_url or feed_url,
  credential_ref) from Taksitlio partner CRM / app CMS into
  crawler/ops/official-partner-export.yaml — then re-run fetch+ingest.
  Inventing the missing ~40 names would violate ADR-010 real-data rules.
