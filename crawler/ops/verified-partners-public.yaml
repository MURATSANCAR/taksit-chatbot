    notes: |
      Same Hybris/Akamai stack as Arçelik. curl_cffi → PRODUCT sitemap (~4.8k).

  - merchant_code: m-decathlon
    display_name: Decathlon
    verification: [PUBLIC_BANK_PAGE]
