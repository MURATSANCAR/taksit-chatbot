version: "3.9"

services:
  postgres:
    # Prefer pgvector image for local runtime verification; plain postgres:16
    # remains fine for schema-only boots. Full stack:
    #   docker compose -f docker/docker-compose.runtime.yml --profile runtime-verification up -d
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taksitlio
      POSTGRES_PASSWORD: taksitlio
      POSTGRES_DB: taksitlio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    # Apply db/bootstrap/dev-models.sql manually after first boot (not auto-seeded).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taksitlio -d taksitlio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://taksitlio:taksitlio@postgres:5432/taksitlio
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: taksitlio
      SESSION_TTL_SECONDS: "86400"
      LOG_LEVEL: INFO
      ALLOW_IN_MEMORY: "false"
      MEDIA_STORAGE_ROOT: /data/media
      CDN_BASE_URL: http://localhost:8000/cdn
    ports:
      - "8000:8000"
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      [
        "taksitlio-scheduler",
        "--use-postgres",
        "--poll-interval",
        "2",
        "--lease-seconds",
        "60",
      ]
    environment:
      DATABASE_URL: postgresql://taksitlio:taksitlio@postgres:5432/taksitlio
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      SCHEDULER_WORKER_ID: scheduler-1
      MEDIA_STORAGE_ROOT: /data/media
      CDN_BASE_URL: http://localhost:8000/cdn
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  media_data:
