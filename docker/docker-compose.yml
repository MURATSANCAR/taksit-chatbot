version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taksitlio
      POSTGRES_PASSWORD: taksitlio
      POSTGRES_DB: taksitlio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    # Apply db/bootstrap/dev-models.sql manually after first boot (not auto-seeded).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taksitlio -d taksitlio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://taksitlio:taksitlio@postgres:5432/taksitlio
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: taksitlio
      SESSION_TTL_SECONDS: "86400"
      LOG_LEVEL: INFO
      ALLOW_IN_MEMORY: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
