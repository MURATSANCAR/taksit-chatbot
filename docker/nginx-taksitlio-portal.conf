# Include inside portal.nanobase.ai server {} (not at http{} — no upstream here).
# Guest UI: https://portal.nanobase.ai/taksitlio/
# API (same-origin for web/taksitlio apiBase ""): /v1/
# Media: /taksitlio-cdn/{storage_key} → MinIO path-style /taksitlio-media/{storage_key}

location = /taksitlio {
    return 301 /taksitlio/;
}

location ^~ /taksitlio/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

location ^~ /v1/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# CDN origin = MinIO bucket (anonymous GetObject on media/*).
# Example: /taksitlio-cdn/media/variants/ab/…/w320.webp
#       →  http://127.0.0.1:9000/taksitlio-media/media/variants/ab/…/w320.webp
location ^~ /taksitlio-cdn/ {
    proxy_pass http://127.0.0.1:9000/taksitlio-media/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9000;
    proxy_set_header Connection "";
    proxy_hide_header x-amz-id-2;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-meta-server-side-encryption;
    proxy_hide_header x-amz-server-side-encryption;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-CDN-Origin "minio" always;
}
