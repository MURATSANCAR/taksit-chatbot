# Include inside portal.nanobase.ai server {} (not at http{} — no upstream here).
# Guest UI: https://portal.nanobase.ai/taksitlio/
# API (same-origin for web/taksitlio apiBase ""): /v1/
# Media: /taksitlio-cdn/ → local MEDIA_STORAGE_ROOT (var/media)

location = /taksitlio {
    return 301 /taksitlio/;
}

location ^~ /taksitlio/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
}

location ^~ /v1/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Product images live on disk under MEDIA_STORAGE_ROOT (not MinIO yet).
location ^~ /taksitlio-cdn/ {
    alias /data/nanobaseai/taksitlio-chatbot/var/media/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    types {
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
        image/gif gif;
    }
    default_type application/octet-stream;
}
