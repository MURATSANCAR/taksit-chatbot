# ADR-009 runtime verification stack.
# Runbook: docs/runbooks/ADR-009-live-runtime-verification.md
#
#   cp .env.example .env.runtime && chmod 600 .env.runtime
#   docker compose --env-file .env.runtime \
#     -f docker/docker-compose.runtime.yml \
#     --profile runtime-verification up -d redis postgres

version: "3.9"

services:
  redis:
    profiles: ["runtime-verification"]
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    profiles: ["runtime-verification"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taksitlio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taksitlio}
      POSTGRES_DB: ${POSTGRES_DB:-taksitlio}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - runtime_pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # FAST / embedding images are NOT bundled.
  # Point FAST_PROVIDER_BASE_URL / EMBEDDING_PROVIDER_BASE_URL at live
  # OpenAI-compatible deployments. Absence → BLOCKED_DEPENDENCY.

volumes:
  runtime_pgdata:
