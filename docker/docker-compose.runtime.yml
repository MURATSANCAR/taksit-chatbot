# ADR-009 runtime verification stack.
# Usage:
#   docker compose -f docker/docker-compose.runtime.yml --profile runtime-verification up -d
# Then:
#   export REDIS_URL=redis://127.0.0.1:6379/15
#   export PGVECTOR_URL=postgres://taksitlio:taksitlio@127.0.0.1:5432/taksitlio
#   export INTEGRATION_REQUIRE_PG=1
#   pytest -m integration tests/integration/redis tests/integration/pgvector -q

version: "3.9"

services:
  redis:
    profiles: ["runtime-verification"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    profiles: ["runtime-verification"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: taksitlio
      POSTGRES_PASSWORD: taksitlio
      POSTGRES_DB: taksitlio
    ports:
      - "5432:5432"
    volumes:
      - runtime_pgdata:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taksitlio -d taksitlio"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional placeholders — operators point FAST_PROVIDER_BASE_URL /
  # EMBEDDING_PROVIDER_BASE_URL at real OpenAI-compatible deployments.
  # No model image is bundled; absence must yield BLOCKED_DEPENDENCY.

volumes:
  runtime_pgdata:
