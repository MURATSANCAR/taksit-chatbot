<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Taksitlio · İhtiyaç Asistanı</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #9747FF;
      --purple-hover: #8433E8;
      --purple-deep: #6C1ED0;
      --purple-soft: #F4EBFF;
      --lime: #D8FF00;
      --ink: #2A2B2E;
      --ink-muted: #6B7280;
      --ink-faint: #9B9DA1;
      --line: #ECECED;
      --shadow: 0 24px 60px rgba(105, 40, 200, 0.16);
      --font: "Sora", system-ui, sans-serif;
      --display: "Outfit", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(1100px 560px at 12% -8%, rgba(151, 71, 255, 0.24), transparent 55%),
        radial-gradient(900px 500px at 92% 0%, rgba(216, 255, 0, 0.12), transparent 45%),
        radial-gradient(700px 420px at 70% 110%, rgba(151, 71, 255, 0.10), transparent 50%),
        linear-gradient(180deg, #F7F3FF 0%, #FAFAFA 42%, #F0F1F4 100%);
    }

    .shell {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .phone {
      width: 100%;
      border-radius: 40px;
      overflow: hidden;
      border: 10px solid #1C1C1E;
      box-shadow: var(--shadow);
      background: #F7F7F8;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 96px; height: 22px; border-radius: 0 0 14px 14px;
      background: #1C1C1E; z-index: 5;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: min(780px, calc(100vh - 80px));
      min-height: 640px;
      background:
        radial-gradient(520px 240px at 50% -10%, rgba(151,71,255,0.18), transparent 60%),
        linear-gradient(180deg, #FBFAFF 0%, #F6F6F8 100%);
    }

    .guest-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 34px 16px 12px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(42,43,46,0.05);
    }
    .wordmark { height: 16px; width: auto; display: block; }
    .guest-pill {
      font-size: 11px; font-weight: 700; color: var(--purple-deep);
      background: var(--purple-soft); padding: 6px 10px; border-radius: 999px;
      white-space: nowrap;
    }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink-muted); font-size: 11px; font-weight: 500; margin-top: 4px;
    }
    .status i {
      width: 7px; height: 7px; border-radius: 50%; background: #22C55E;
      display: inline-block; animation: pulse 1.8s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: .7; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stage {
      padding: 16px 14px 8px;
      overflow: auto;
      scroll-behavior: smooth;
    }

    .screen { animation: rise .35s ease both; }
    .screen[hidden] { display: none !important; }

    .welcome {
      text-align: center;
      padding: 28px 8px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 42%;
    }
    .hero-mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px;
      background: linear-gradient(145deg, #A66BFF, var(--purple-deep));
      display: grid; place-items: center;
      box-shadow: 0 16px 40px rgba(151,71,255,0.35);
      position: relative;
    }
    .hero-mark img {
      width: 36px; height: 36px; object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .hero-mark::before {
      content: ""; position: absolute; top: -3px; right: -2px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--lime);
      box-shadow: 0 0 0 4px rgba(216,255,0,0.18);
    }
    .welcome h1 {
      font-family: var(--display); font-size: 28px; letter-spacing: -0.035em;
      margin: 0 0 10px; line-height: 1.2; font-weight: 700;
    }
    .welcome p {
      margin: 0 auto; color: var(--ink-muted); line-height: 1.5;
      max-width: 30ch; font-size: 13.5px;
    }

    .thread { display: flex; flex-direction: column; gap: 12px; }
    .bubble {
      max-width: 88%; padding: 13px 14px; border-radius: 18px;
      line-height: 1.5; font-size: 13.5px;
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #A15CFF, var(--purple));
      color: white; border-bottom-right-radius: 6px;
      box-shadow: 0 10px 24px rgba(151,71,255,0.25);
    }
    .bubble.bot {
      align-self: flex-start; background: white;
      border: 1px solid rgba(42,43,46,0.06);
      border-bottom-left-radius: 6px;
      box-shadow: 0 10px 30px rgba(42,43,46,0.05);
    }
    .row-bot {
      display: flex; gap: 8px; align-items: flex-start; max-width: 100%;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(145deg, #A66BFF, var(--purple-deep));
      display: grid; place-items: center; flex-shrink: 0; margin-top: 2px;
    }
    .avatar img {
      width: 15px; height: 15px; filter: brightness(0) invert(1);
    }
    .ghost { visibility: hidden; }

    .actions {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin: 4px 0 0 36px;
    }
    .btn, .chip {
      appearance: none; border: 1.5px solid rgba(151,71,255,0.35);
      background: rgba(255,255,255,0.95); color: var(--purple);
      font: inherit; font-size: 12.5px; font-weight: 700;
      padding: 10px 14px; border-radius: 999px; cursor: pointer;
      transition: transform .18s, background .18s, border-color .18s;
    }
    .btn:hover, .chip:hover {
      transform: translateY(-1px); background: var(--purple-soft); border-color: var(--purple);
    }
    .btn.primary {
      border: 0; background: var(--purple); color: white;
      box-shadow: 0 10px 22px rgba(151,71,255,0.28);
    }
    .btn.primary:hover { background: var(--purple-hover); }
    .btn.lime {
      border: 0; background: var(--lime); color: var(--ink);
      box-shadow: 0 10px 22px rgba(216,255,0,0.35);
      width: 100%; text-align: center;
    }
    .btn:disabled { opacity: .55; cursor: wait; transform: none; }

    .extract, .campaign {
      width: 100%; background: white;
      border: 1px solid rgba(42,43,46,0.06); border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 30px rgba(42,43,46,0.05);
    }
    .extract-head, .offer-head {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px; background: linear-gradient(90deg, var(--purple-soft), #FBF8FF);
      color: var(--purple-deep); font-size: 11px; font-weight: 700;
      letter-spacing: .02em; text-transform: uppercase;
    }
    .extract-row {
      display: grid; grid-template-columns: 88px 1fr; gap: 8px;
      padding: 12px 14px; border-top: 1px solid var(--line); font-size: 13px;
    }
    .extract-row .k { color: var(--ink-faint); font-weight: 500; }
    .extract-row .v { font-weight: 600; }

    .campaign { position: relative; }
    .campaign.best {
      background: linear-gradient(180deg, rgba(216,255,0,0.10), white 36%);
    }
    .campaign.best::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--lime);
    }
    .camp-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; padding: 14px 14px 8px;
    }
    .camp-brand { font-weight: 700; font-size: 14px; }
    .camp-meta { color: var(--ink-muted); font-size: 12px; margin-top: 3px; line-height: 1.4; }
    .badge {
      font-size: 10px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; padding: 5px 8px; border-radius: 999px;
      background: var(--lime); color: var(--ink); white-space: nowrap;
    }
    .badge.soft { background: var(--purple-soft); color: var(--purple-deep); }
    .camp-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 4px 14px 12px;
    }
    .stat { background: #FAFAFA; border-radius: 12px; padding: 10px 12px; }
    .stat .l { font-size: 10px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; }
    .stat .n { font-size: 15px; font-weight: 700; margin-top: 3px; }
    .stat .n.purple { color: var(--purple); }
    .camp-foot {
      padding: 0 14px 14px; font-size: 12px; color: var(--ink-muted); font-weight: 500;
    }

    .cta-card {
      width: 100%;
      background: linear-gradient(145deg, #7A35F0 0%, #9747FF 50%, #5B17C4 100%);
      color: white; border-radius: 20px; padding: 16px;
      box-shadow: 0 16px 36px rgba(151,71,255,0.28);
      position: relative; overflow: hidden;
    }
    .cta-card::after {
      content: ""; position: absolute; right: -30px; top: -30px;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(216,255,0,0.16);
    }
    .cta-card h3 {
      position: relative; margin: 0 0 6px; font-family: var(--display);
      font-size: 18px; letter-spacing: -0.02em;
    }
    .cta-card p {
      position: relative; margin: 0 0 14px; font-size: 12.5px;
      line-height: 1.45; opacity: .9;
    }
    .cta-card .btn.lime { position: relative; }

    /* Centered, prominent composer on welcome */
    .composer {
      padding: 12px 14px 20px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.9) 24%);
    }
    .composer.welcome-mode {
      padding: 8px 18px 28px;
    }
    .composer-box {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 16px; background: white; border-radius: 999px;
      border: 1.5px solid rgba(151,71,255,0.18);
      box-shadow:
        0 14px 36px rgba(151,71,255,0.14),
        0 0 0 4px rgba(151,71,255,0.05);
      transition: box-shadow .2s, border-color .2s, transform .2s;
    }
    .composer.welcome-mode .composer-box {
      transform: translateY(-4px);
      padding: 12px 10px 12px 18px;
      border-color: rgba(151,71,255,0.28);
      box-shadow:
        0 18px 44px rgba(151,71,255,0.18),
        0 0 0 6px rgba(151,71,255,0.07);
    }
    .composer-box:focus-within {
      border-color: var(--purple);
      box-shadow:
        0 18px 44px rgba(151,71,255,0.2),
        0 0 0 6px rgba(151,71,255,0.1);
    }
    .composer-box input {
      flex: 1; border: 0; outline: 0; background: transparent;
      font: inherit; font-size: 14px; color: var(--ink); min-width: 0;
    }
    .composer.welcome-mode .composer-box input { font-size: 15px; }
    .composer-box input::placeholder { color: var(--ink-faint); }
    .send {
      width: 44px; height: 44px; border: 0; border-radius: 50%;
      background: linear-gradient(145deg, #A66BFF, var(--purple));
      display: grid; place-items: center; cursor: pointer; position: relative;
      box-shadow: 0 10px 22px rgba(151,71,255,0.35);
      transition: transform .15s;
    }
    .composer.welcome-mode .send { width: 48px; height: 48px; }
    .send:hover { transform: scale(1.05); }
    .send:disabled { opacity: .6; cursor: wait; transform: none; }
    .send svg { width: 17px; height: 17px; fill: white; }
    .send::after {
      content: ""; position: absolute; top: -2px; right: -2px;
      width: 9px; height: 9px; border-radius: 50%; background: var(--lime);
      box-shadow: 0 0 0 3px rgba(216,255,0,0.25);
    }

    .typing {
      display: inline-flex; gap: 4px; align-items: center; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--purple);
      animation: bounce 1.1s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .hint {
      text-align: center; font-size: 12px; color: var(--ink-faint);
      margin-top: 2px;
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: white; padding: 12px 18px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2); opacity: 0;
      pointer-events: none; transition: opacity .25s, transform .25s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* —— Motion pack (presence, not noise) —— */
    @keyframes welcomeIn {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes titleIn {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    @keyframes softIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes bubbleUserIn {
      from { opacity: 0; transform: translateY(16px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes bubbleBotIn {
      from { opacity: 0; transform: translateY(14px) translateX(-6px) scale(.94); }
      to { opacity: 1; transform: none; }
    }
    @keyframes chipIn {
      from { opacity: 0; transform: translateY(8px) scale(.9); }
      to { opacity: 1; transform: none; }
    }
    @keyframes chipPop {
      0% { transform: scale(1); }
      40% { transform: scale(.94); }
      100% { transform: scale(1); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes limeDraw {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }
    @keyframes badgePop {
      from { opacity: 0; transform: scale(.6); }
      to { opacity: 1; transform: none; }
    }
    @keyframes ctaIn {
      from { opacity: 0; transform: translateY(16px) scale(.97); }
      to { opacity: 1; transform: none; }
    }
    @keyframes breath {
      0%, 100% { box-shadow: 0 10px 22px rgba(216,255,0,0.35), 0 0 0 0 rgba(216,255,0,0.35); }
      50% { box-shadow: 0 12px 28px rgba(216,255,0,0.45), 0 0 0 8px rgba(216,255,0,0.12); }
    }
    @keyframes promptPulse {
      0%, 100% {
        box-shadow:
          0 18px 44px rgba(151,71,255,0.18),
          0 0 0 6px rgba(151,71,255,0.07);
      }
      50% {
        box-shadow:
          0 20px 48px rgba(151,71,255,0.26),
          0 0 0 10px rgba(151,71,255,0.12);
      }
    }
    @keyframes screenSwap {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes sparkle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: .7; }
    }

    .welcome .hero-mark {
      animation: welcomeIn .7s cubic-bezier(.22,1,.36,1) both, floaty 4.5s ease-in-out 0.7s infinite;
    }
    .welcome .hero-mark::before {
      animation: sparkle 2.2s ease-in-out infinite;
    }
    .welcome h1 {
      animation: titleIn .65s cubic-bezier(.22,1,.36,1) .12s both;
    }
    .welcome p {
      animation: softIn .55s ease .22s both;
    }
    #screen-welcome .thread {
      animation: softIn .55s ease .32s both;
    }

    .composer.welcome-mode .composer-box {
      animation: softIn .6s ease .45s both, promptPulse 2.6s ease-in-out 1.1s infinite;
    }
    .composer.welcome-mode .composer-box:focus-within {
      animation: none;
    }
    .hint {
      animation: softIn .5s ease .55s both;
    }

    .bubble.user.anim {
      animation: bubbleUserIn .42s cubic-bezier(.22,1,.36,1) both;
    }
    .row-bot.anim {
      animation: bubbleBotIn .45s cubic-bezier(.22,1,.36,1) both;
    }
    .actions.anim .chip {
      opacity: 0;
      animation: chipIn .38s cubic-bezier(.22,1,.36,1) both;
    }
    .actions.anim .chip:nth-child(1) { animation-delay: .04s; }
    .actions.anim .chip:nth-child(2) { animation-delay: .1s; }
    .actions.anim .chip:nth-child(3) { animation-delay: .16s; }
    .actions.anim .chip:nth-child(4) { animation-delay: .22s; }
    .chip.is-pressed { animation: chipPop .28s ease; }

    .offer-block.anim {
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    .campaign.best.anim::before {
      transform-origin: top;
      animation: limeDraw .55s cubic-bezier(.22,1,.36,1) .15s both;
    }
    .campaign.anim .badge {
      animation: badgePop .4s cubic-bezier(.22,1,.36,1) .25s both;
    }
    .cta-card.anim {
      animation: ctaIn .55s cubic-bezier(.22,1,.36,1) both;
    }
    .btn.lime.breath {
      animation: breath 2.4s ease-in-out infinite;
    }

    .screen.swap-in {
      animation: screenSwap .4s cubic-bezier(.22,1,.36,1) both;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="phone" aria-label="Taksitlio ihtiyaç asistanı">
      <div class="app">
        <header class="guest-bar">
          <div>
            <img class="wordmark" src="assets/logowithlabel.png" alt="taksitlio" />
            <div class="status"><i></i> <span id="statusText">Misafir asistan</span></div>
          </div>
          <div class="guest-pill">Giriş yapmadan</div>
        </header>

        <main class="stage" id="stage">
          <!-- SCREEN 1: Welcome -->
          <section class="screen" id="screen-welcome">
            <div class="welcome">
              <div class="hero-mark"><img src="assets/favicon.png" alt="" /></div>
              <h1>Merhaba 👋</h1>
              <p>Henüz üye olmadan, senin için en uygun kampanyayı bulmana yardımcı olabilirim.</p>
            </div>
            <div class="thread">
              <div class="row-bot">
                <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
                <div class="bubble bot">
                  Senin için hızlı bir <strong>ihtiyaç analizi</strong> yapayım mı?
                  Ne almak istediğini ve bütçeni kendi cümlelerinle yazman yeterli.
                </div>
              </div>
            </div>
          </section>

          <!-- SCREEN 2: Clarify chat -->
          <section class="screen" id="screen-chat" hidden>
            <div class="thread" id="chatThread"></div>
          </section>

          <!-- SCREEN 3: Campaigns -->
          <section class="screen" id="screen-offers" hidden>
            <div class="thread" id="offersThread"></div>
          </section>
        </main>

        <footer class="composer welcome-mode" id="composer">
          <form id="promptForm" autocomplete="off">
            <div class="composer-box">
              <input
                id="promptInput"
                type="text"
                maxlength="280"
                placeholder="Örn. cep telefonu, bütçem 40 bin…"
                aria-label="İhtiyaç mesajın"
              />
              <button class="send" type="submit" id="sendBtn" aria-label="Gönder">
                <svg viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
              </button>
            </div>
          </form>
          <div class="hint" id="composerHint">İhtiyacını ve bütçeni yaz, gönder</div>
        </footer>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const DEMO_CAMPAIGNS = [
      {
        best: true,
        brand: "Samsung Galaxy A56",
        meta: "MediaMarkt × Yapı Kredi · 0 faiz fırsatı",
        badge: "En uygun",
        monthly: "3.249 TL",
        tenure: "12 ay",
        total: "Toplam ≈ 38.990 TL",
      },
      {
        best: false,
        brand: "iPhone 15 128GB",
        meta: "Vatan × Akbank · peşinatlı taksit",
        badge: "Alternatif",
        monthly: "3.499 TL",
        tenure: "12 ay",
        total: "Toplam ≈ 41.990 TL",
      },
    ];

    const CATEGORY_CHIPS = [
      { label: "Cep telefonu", value: "phone" },
      { label: "Beyaz eşya", value: "appliance" },
      { label: "Mobilya", value: "furniture" },
      { label: "Başka bir şey", value: "other" },
    ];

    const BUDGET_CHIPS = [
      { label: "20 bin civarı", value: "20000" },
      { label: "40 bin civarı", value: "40000" },
      { label: "60 bin+", value: "60000" },
    ];

    const BRAND_CHIPS_PHONE = [
      { label: "Samsung", value: "samsung" },
      { label: "iPhone", value: "iphone" },
      { label: "Fark etmez", value: "any" },
    ];

    const els = {
      status: document.getElementById("statusText"),
      stage: document.getElementById("stage"),
      welcome: document.getElementById("screen-welcome"),
      chat: document.getElementById("screen-chat"),
      offers: document.getElementById("screen-offers"),
      chatThread: document.getElementById("chatThread"),
      offersThread: document.getElementById("offersThread"),
      form: document.getElementById("promptForm"),
      input: document.getElementById("promptInput"),
      send: document.getElementById("sendBtn"),
      composer: document.getElementById("composer"),
      hint: document.getElementById("composerHint"),
      toast: document.getElementById("toast"),
    };

    let busy = false;
    const state = {
      category: null,
      budget: null,
      brand: null,
      awaiting: null,
    };

    function resetState() {
      state.category = null;
      state.budget = null;
      state.brand = null;
      state.awaiting = null;
      els.chatThread.innerHTML = "";
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function setBusy(v) {
      busy = v;
      els.send.disabled = v;
      els.input.disabled = v;
    }

    function showScreen(name) {
      const map = { welcome: els.welcome, chat: els.chat, offers: els.offers };
      els.welcome.hidden = name !== "welcome";
      els.chat.hidden = name !== "chat";
      els.offers.hidden = name !== "offers";
      els.composer.classList.toggle("welcome-mode", name === "welcome");
      els.hint.hidden = name !== "welcome";
      const active = map[name];
      if (active) {
        active.classList.remove("swap-in");
        void active.offsetWidth;
        active.classList.add("swap-in");
      }
      if (name !== "offers") els.stage.scrollTop = 0;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function scrollChat() {
      requestAnimationFrame(() => {
        els.stage.scrollTop = els.stage.scrollHeight;
      });
    }

    function appendUser(text) {
      els.chatThread.insertAdjacentHTML(
        "beforeend",
        `<div class="bubble user anim">${escapeHtml(text)}</div>`
      );
      scrollChat();
    }

    function appendBot(html, chips) {
      const chipHtml = chips?.length
        ? `<div class="actions anim">${chips
            .map(
              (c) =>
                `<button class="chip" type="button" data-chip="${escapeHtml(c.value)}" data-label="${escapeHtml(c.label)}">${escapeHtml(c.label)}</button>`
            )
            .join("")}</div>`
        : "";
      els.chatThread.insertAdjacentHTML(
        "beforeend",
        `<div class="row-bot anim">
          <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
          <div class="bubble bot">${html}</div>
        </div>${chipHtml}`
      );
      els.chatThread.querySelectorAll(".actions:last-of-type .chip").forEach((btn) => {
        btn.addEventListener("click", () => onChip(btn.dataset.chip, btn.dataset.label, btn));
      });
      scrollChat();
    }

    function appendTyping() {
      const id = `typing-${Date.now()}`;
      els.chatThread.insertAdjacentHTML(
        "beforeend",
        `<div class="row-bot anim" id="${id}">
          <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
          <div class="bubble bot"><span class="typing"><span></span><span></span><span></span></span></div>
        </div>`
      );
      scrollChat();
      return id;
    }

    function removeNode(id) {
      document.getElementById(id)?.remove();
    }

    function clearOpenChips() {
      els.chatThread.querySelectorAll(".actions").forEach((el) => el.remove());
    }

    function parseBudget(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      let m = lower.match(/(\d+[.,]?\d*)\s*(bin|k)\b/);
      if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
      m = lower.match(/(\d{1,3}(?:[.,]\d{3})+|\d{4,7})\s*(tl|₺)?/);
      if (m) {
        const n = parseInt(m[1].replace(/[.,]/g, ""), 10);
        if (n >= 1000) return n;
      }
      return null;
    }

    function parseCategory(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      if (/telefon|iphone|samsung|xiaomi|huawei|oppo|cep\s*telefon|android/.test(lower)) return "phone";
      if (/buzdolab|çamaşır|bulas[ıi]k|bulaşık|beyaz\s*eşya|klima|fırın/.test(lower)) return "appliance";
      if (/koltuk|masa|yatak|mobilya|dolap/.test(lower)) return "furniture";
      return null;
    }

    function parseBrand(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      if (/iphone|apple/.test(lower)) return "iphone";
      if (/samsung|galaxy/.test(lower)) return "samsung";
      if (/fark\s*etmez|herhangi|olur/.test(lower)) return "any";
      return null;
    }

    function mergeFromText(text) {
      const cat = parseCategory(text);
      const budget = parseBudget(text);
      const brand = parseBrand(text);
      if (cat) state.category = cat;
      if (budget) state.budget = budget;
      if (brand) state.brand = brand;
    }

    function categoryLabel(c) {
      return ({ phone: "cep telefonu", appliance: "beyaz eşya", furniture: "mobilya", other: "alışveriş" }[c] || "ürün");
    }

    function budgetLabel(n) {
      return `${n.toLocaleString("tr-TR")} TL`;
    }

    function nextClarify() {
      if (!state.category) {
        state.awaiting = "category";
        return { text: "Ne almak istiyorsun? Kısaca seçebilir veya yazabilirsin.", chips: CATEGORY_CHIPS };
      }
      if (!state.budget) {
        state.awaiting = "budget";
        return { text: `${categoryLabel(state.category)} için yaklaşık bütçen ne kadar?`, chips: BUDGET_CHIPS };
      }
      if (state.category === "phone" && !state.brand) {
        state.awaiting = "brand";
        return { text: "Marka tercihin var mı, yoksa bütçene göre en uygununu mu getireyim?", chips: BRAND_CHIPS_PHONE };
      }
      state.awaiting = null;
      return null;
    }

    function campaignCard(c, i) {
      const delay = 0.12 + i * 0.14;
      return `
        <div class="row-bot offer-block anim" style="animation-delay:${delay}s">
          <div class="avatar ghost"></div>
          <div class="campaign anim ${c.best ? "best" : ""}">
            <div class="camp-top">
              <div>
                <div class="camp-brand">${escapeHtml(c.brand)}</div>
                <div class="camp-meta">${escapeHtml(c.meta)}</div>
              </div>
              <span class="badge ${c.best ? "" : "soft"}">${escapeHtml(c.badge)}</span>
            </div>
            <div class="camp-stats">
              <div class="stat"><div class="l">Aylık</div><div class="n purple">${escapeHtml(c.monthly)}</div></div>
              <div class="stat"><div class="l">Vade</div><div class="n">${escapeHtml(c.tenure)}</div></div>
            </div>
            <div class="camp-foot">${escapeHtml(c.total)}</div>
          </div>
        </div>`;
    }

    function renderOffers() {
      const budgetText = budgetLabel(state.budget || 40000);
      els.offersThread.innerHTML = `
        <div class="row-bot anim">
          <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
          <div class="bubble bot">
            Bankalar ve markalar arasındaki güncel kampanyaları taradım.
            <strong>${escapeHtml(budgetText)}</strong> bütçene en uygun 2 seçenek:
          </div>
        </div>
        ${DEMO_CAMPAIGNS.map(campaignCard).join("")}
        <div class="row-bot offer-block anim" style="animation-delay:.42s">
          <div class="avatar ghost"></div>
          <div class="cta-card anim">
            <h3>Üye ol, kampanyadan yararlan</h3>
            <p>Bu teklifleri kilitlemek ve başvuruya devam etmek için ücretsiz üye olman yeterli. Limit sorgulama da üyelikle açılır.</p>
            <button class="btn lime breath" type="button" id="btnSignup">Üye ol · 30 saniye</button>
          </div>
        </div>`;
      document.getElementById("btnSignup").onclick = () => showToast("Üyelik akışı yakında BE’ye bağlanacak");
      requestAnimationFrame(() => { els.stage.scrollTop = els.stage.scrollHeight; });
    }

    async function wait(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function runCampaignSearch() {
      if (busy) return;
      setBusy(true);
      els.status.textContent = "Kampanyalar taranıyor";
      clearOpenChips();
      const typingId = appendTyping();
      await wait(900);
      removeNode(typingId);
      showScreen("offers");
      renderOffers();
      els.status.textContent = "2 kampanya bulundu";
      setBusy(false);
      els.composer.classList.remove("welcome-mode");
      els.hint.hidden = true;
      els.input.placeholder = "Başka bir ihtiyaç yaz…";
    }

    async function botRespondAfterUser() {
      const typingId = appendTyping();
      await wait(550);
      removeNode(typingId);
      const clarify = nextClarify();
      if (clarify) {
        els.status.textContent = "Biraz daha netleştirelim";
        appendBot(clarify.text, clarify.chips);
        els.input.placeholder =
          state.awaiting === "budget" ? "Örn. 40 bin TL"
          : state.awaiting === "brand" ? "Örn. Samsung isterim"
          : "İhtiyacını yaz…";
        return;
      }
      appendBot("Tamam, buna göre kampanyaları tarıyorum…");
      await wait(400);
      await runCampaignSearch();
    }

    async function handleUserText(text) {
      const prompt = text.trim();
      if (!prompt || busy) return;
      const starting = els.welcome.hidden === false;
      if (starting) {
        resetState();
        showScreen("chat");
        els.composer.classList.remove("welcome-mode");
        els.hint.hidden = true;
      }
      clearOpenChips();
      appendUser(prompt);
      els.input.value = "";
      setBusy(true);
      els.status.textContent = "Dinliyorum";

      if (state.awaiting === "budget") {
        const n = parseBudget(prompt);
        if (n) state.budget = n;
        else if (/^\d[\d.,]*$/.test(prompt.trim())) {
          let v = parseInt(prompt.replace(/[.,]/g, ""), 10);
          if (v < 1000) v *= 1000;
          state.budget = v;
        }
      } else if (state.awaiting === "category") {
        const c = parseCategory(prompt);
        if (c) state.category = c;
        else if (/diğer|başka|genel/.test(prompt.toLocaleLowerCase("tr-TR"))) state.category = "other";
      } else if (state.awaiting === "brand") {
        state.brand = parseBrand(prompt) || "any";
      } else {
        mergeFromText(prompt);
      }

      await botRespondAfterUser();
      setBusy(false);
      els.input.focus();
    }

    async function onChip(value, label, el) {
      if (busy) return;
      if (el) {
        el.classList.add("is-pressed");
        await wait(160);
      }
      clearOpenChips();
      appendUser(label);
      setBusy(true);
      if (state.awaiting === "category" || (!state.category && CATEGORY_CHIPS.some((c) => c.value === value))) {
        state.category = value;
      } else if (state.awaiting === "budget" || BUDGET_CHIPS.some((c) => c.value === value)) {
        state.budget = parseInt(value, 10);
      } else if (state.awaiting === "brand" || BRAND_CHIPS_PHONE.some((c) => c.value === value)) {
        state.brand = value;
      }
      await botRespondAfterUser();
      setBusy(false);
      els.input.focus();
    }

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      handleUserText(els.input.value);
    });

    showScreen("welcome");
    els.input.focus();
  </script>
</body>
</html>
