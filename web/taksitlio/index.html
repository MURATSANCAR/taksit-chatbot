<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Taksitlio · İhtiyaç Asistanı</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #9747FF;
      --purple-deep: #6C1ED0;
      --lime: #D8FF00;
      --ink: #1E1F22;
      --muted: #6F737A;
      --line: rgba(30, 31, 34, 0.08);
      --surface: #FFFFFF;
      --bg: #F3F1F6;
      --font: "Figtree", system-ui, sans-serif;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 20px 14px;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(151, 71, 255, 0.14), transparent 55%),
        linear-gradient(180deg, #EDE8F5 0%, #F6F5F7 48%, #ECECEE 100%);
    }

    .shell { width: min(390px, 100%); }

    .phone {
      width: 100%;
      border-radius: 36px;
      overflow: hidden;
      border: 9px solid #141416;
      background: var(--surface);
      box-shadow:
        0 30px 70px rgba(40, 20, 80, 0.18),
        0 2px 0 rgba(255,255,255,0.35) inset;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 9px; left: 50%; transform: translateX(-50%);
      width: 88px; height: 20px;
      border-radius: 0 0 12px 12px;
      background: #141416;
      z-index: 20;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: min(760px, calc(100vh - 56px));
      min-height: 620px;
      background: var(--bg);
    }

    /* ── Header ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 18px 12px;
      background: var(--bg);
      position: relative;
      z-index: 5;
    }
    .wordmark { height: 15px; width: auto; display: block; }
    .top-note {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Stage ── */
    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .view {
      position: absolute;
      inset: 0;
      padding: 8px 18px 12px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .32s ease, transform .38s cubic-bezier(.22,1,.36,1);
      display: flex;
      flex-direction: column;
    }
    .view.is-on {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    /* ── Idle ── */
    .idle {
      justify-content: space-between;
      gap: 18px;
      padding-top: 18px;
      padding-bottom: 8px;
    }
    .idle-hero {
      max-width: 17ch;
      animation: rise .7s cubic-bezier(.22,1,.36,1) both;
    }
    .idle-kicker {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple-deep);
      margin-bottom: 12px;
    }
    .idle-hero h1 {
      font-family: var(--display);
      font-size: clamp(28px, 8vw, 34px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
      margin: 0 0 12px;
    }
    .idle-hero p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      max-width: 28ch;
    }

    .shelf {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr 0.95fr;
      gap: 8px;
      height: 148px;
      animation: rise .8s cubic-bezier(.22,1,.36,1) .08s both;
    }
    .shelf figure {
      margin: 0;
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      position: relative;
    }
    .shelf figure:nth-child(1) { transform: translateY(8px); }
    .shelf figure:nth-child(2) { transform: translateY(-6px); }
    .shelf figure:nth-child(3) { transform: translateY(14px); }
    .shelf img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease, filter .35s ease, opacity .35s ease;
    }
    .shelf.is-live figure:not(.is-hot) img {
      opacity: 0.35;
      filter: grayscale(0.5);
    }
    .shelf.is-live figure.is-hot img {
      transform: scale(1.04);
      opacity: 1;
      filter: none;
    }
    .shelf figcaption {
      position: absolute;
      left: 8px; bottom: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.45);
    }

    /* ── Reading ── */
    .reading {
      justify-content: center;
      align-items: flex-start;
      gap: 22px;
    }
    .reading-mark {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 0 6px rgba(216,255,0,.25);
      animation: pulse 1.1s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: .7; }
    }
    .reading h2 {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
      line-height: 1.15;
    }
    .facts {
      display: grid;
      gap: 10px;
      width: 100%;
    }
    .fact {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(8px);
    }
    .fact.on {
      animation: rise .45s cubic-bezier(.22,1,.36,1) forwards;
    }
    .fact .k {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .fact .v {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* ── Offers ── */
    .offers {
      gap: 14px;
      overflow: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .offers::-webkit-scrollbar { display: none; }
    .offers-head {
      opacity: 0;
      transform: translateY(8px);
    }
    .offers-head.on { animation: rise .45s cubic-bezier(.22,1,.36,1) forwards; }
    .offers-head .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple-deep);
      margin-bottom: 6px;
    }
    .offers-head h2 {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 4px;
      line-height: 1.1;
    }
    .offers-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .deal-list {
      display: grid;
      gap: 10px;
    }

    .deal {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 12px;
      align-items: stretch;
      background: var(--surface);
      border-radius: 20px;
      padding: 10px;
      border: 1px solid transparent;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset;
      opacity: 0;
      transform: translateY(14px);
    }
    .deal.on { animation: rise .5s cubic-bezier(.22,1,.36,1) forwards; }
    .deal.best {
      border-color: rgba(151, 71, 255, 0.22);
      box-shadow:
        0 10px 28px rgba(151, 71, 255, 0.1),
        0 1px 0 rgba(255,255,255,0.8) inset;
    }
    .deal-media {
      border-radius: 14px;
      overflow: hidden;
      background: #ECEAF0;
      min-height: 96px;
    }
    .deal-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .deal-media.is-empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px;
      text-align: center;
    }
    .deal-price .hint {
      display: block;
      margin-top: 4px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.3;
    }
    .reply-box {
      margin: 0 0 8px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
      white-space: pre-wrap;
    }
    .deal-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 4px 2px 0;
      min-width: 0;
    }
    .deal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .deal-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .deal-meta {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }
    .pill {
      flex: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      white-space: nowrap;
    }
    .pill.soft {
      background: rgba(151, 71, 255, 0.1);
      color: var(--purple-deep);
    }
    .deal-price {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 10px;
    }
    .deal-price .n {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--purple);
      line-height: 1;
    }
    .deal-price .l {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .cta {
      margin-top: 2px;
      opacity: 0;
      transform: translateY(12px);
    }
    .cta.on { animation: rise .5s cubic-bezier(.22,1,.36,1) forwards; }
    .cta button {
      appearance: none;
      border: 0;
      width: 100%;
      cursor: pointer;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 15px 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background .2s ease, transform .15s ease;
    }
    .cta button:hover { background: #2A2B2E; }
    .cta button:active { transform: scale(0.985); }
    .cta button span:last-child {
      color: var(--lime);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .cta-note {
      margin: 8px 2px 0;
      text-align: center;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* ── Composer ── */
    .composer {
      padding: 10px 14px 16px;
      background: linear-gradient(180deg, transparent, var(--bg) 24%);
      position: relative;
      z-index: 5;
    }
    .composer-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(30, 31, 34, 0.06);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer-box:focus-within {
      border-color: rgba(151, 71, 255, 0.45);
      box-shadow:
        0 10px 30px rgba(151, 71, 255, 0.1),
        0 0 0 3px rgba(151, 71, 255, 0.08);
    }
    .composer-box textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font: inherit;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--ink);
      padding: 10px 8px;
      min-height: 46px;
      max-height: 96px;
    }
    .composer-box textarea::placeholder { color: #A0A3A9; }
    .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      background: var(--purple);
      color: #fff;
      display: grid;
      place-items: center;
      transition: background .15s ease, transform .15s ease;
    }
    .send:hover { background: #8433E8; }
    .send:active { transform: scale(0.96); }
    .send:disabled { opacity: 0.45; cursor: wait; }
    .send svg { width: 16px; height: 16px; fill: currentColor; }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: .25s;
      z-index: 40;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="phone" aria-label="Taksitlio ihtiyaç asistanı">
      <div class="app">
        <header class="top">
          <img class="wordmark" src="assets/logowithlabel.png" alt="taksitlio" />
          <div class="top-note" id="statusText">Misafir</div>
        </header>

        <main class="stage" id="stage">
          <section class="view idle is-on" id="view-idle">
            <div class="idle-hero">
              <div class="idle-kicker">İhtiyaç asistanı</div>
              <h1>Sana en uygun taksiti bulalım</h1>
              <p>Ne almak istediğini ve bütçeni yaz. Katalogdaki gerçek ürün ve tahmini ödemeleri getireyim.</p>
            </div>
            <div class="shelf" id="shelf" aria-hidden="true">
              <figure data-cat="phone">
                <img src="assets/products/phone-1.jpg" alt="" />
                <figcaption>Telefon</figcaption>
              </figure>
              <figure data-cat="laptop">
                <img src="assets/products/laptop.jpg" alt="" />
                <figcaption>Laptop</figcaption>
              </figure>
              <figure data-cat="wearable">
                <img src="assets/products/watch.jpg" alt="" />
                <figcaption>Watch</figcaption>
              </figure>
            </div>
          </section>

          <section class="view reading" id="view-reading">
            <div class="reading-mark" aria-hidden="true"></div>
            <h2 id="readingTitle">Anlıyorum…</h2>
            <div class="facts" id="facts"></div>
          </section>

          <section class="view offers" id="view-offers">
            <div class="offers-head" id="offersHead">
              <div class="eyebrow" id="offersEyebrow">Sonuçlar</div>
              <h2 id="showTitle">Uygun seçenekler</h2>
              <p id="showSub"></p>
            </div>
            <div class="reply-box" id="replyBox" hidden></div>
            <div class="deal-list" id="deals"></div>
            <div class="cta" id="cta">
              <button type="button" id="btnSignup">
                <span id="ctaLabel">Üye ol, devam et</span>
                <span>→</span>
              </button>
              <p class="cta-note" id="ctaNote">
                Tahmini ödemeler bilgilendirme amaçlıdır. Kişisel kredi onayı ayrıca değerlendirilir.
              </p>
            </div>
          </section>
        </main>

        <footer class="composer">
          <form id="form" autocomplete="off">
            <div class="composer-box">
              <textarea
                id="input"
                rows="2"
                maxlength="500"
                placeholder="Örn. cep telefonu alacağım, bütçem 40 bin…"
                aria-label="İhtiyaç prompt’u"
              ></textarea>
              <button class="send" id="send" type="submit" aria-label="Gönder">
                <svg viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
              </button>
            </div>
          </form>
        </footer>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/chat-cards.js"></script>
  <script>
    const Cards = window.TaksitlioCards;
    const CHAT_URL = "/v1/chat";

    const els = {
      status: document.getElementById("statusText"),
      idle: document.getElementById("view-idle"),
      reading: document.getElementById("view-reading"),
      offers: document.getElementById("view-offers"),
      shelf: document.getElementById("shelf"),
      readingTitle: document.getElementById("readingTitle"),
      facts: document.getElementById("facts"),
      offersHead: document.getElementById("offersHead"),
      offersEyebrow: document.getElementById("offersEyebrow"),
      showTitle: document.getElementById("showTitle"),
      showSub: document.getElementById("showSub"),
      replyBox: document.getElementById("replyBox"),
      deals: document.getElementById("deals"),
      cta: document.getElementById("cta"),
      ctaLabel: document.getElementById("ctaLabel"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      toast: document.getElementById("toast"),
      signup: document.getElementById("btnSignup"),
    };

    const views = { idle: els.idle, reading: els.reading, offers: els.offers };
    let busy = false;
    let active = "idle";
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    /** Soft UI hint only — never used as product/merchant/rate source of truth. */
    function parseHint(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      let category = null;
      let shelfCat = null;
      if (/telefon|iphone|samsung|xiaomi|cep|mobil/.test(lower)) {
        category = "Cep telefonu";
        shelfCat = "phone";
      } else if (/tablet|ipad/.test(lower)) {
        category = "Tablet";
        shelfCat = "phone";
      } else if (/saat|watch/.test(lower)) {
        category = "Akıllı saat";
        shelfCat = "wearable";
      } else if (/kulaklık|airpods|buds/.test(lower)) {
        category = "Kulaklık";
        shelfCat = "wearable";
      } else if (/laptop|bilgisayar|macbook/.test(lower)) {
        category = "Laptop";
        shelfCat = "laptop";
      }

      let budget = null;
      let m = lower.match(/(\d+[.,]?\d*)\s*(bin|k)\b/);
      if (m) budget = Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
      else {
        m = lower.match(/(\d{1,3}(?:[.,]\d{3})+|\d{4,7})/);
        if (m) {
          const n = parseInt(m[1].replace(/[.,]/g, ""), 10);
          if (n >= 1000) budget = n;
        }
      }
      return { category, budget, shelfCat, raw: text.trim() };
    }

    function money(n) {
      return Cards.formatMoney(n, "TRY");
    }

    async function showView(name) {
      if (active === name) {
        views[name].classList.add("is-on");
        return;
      }
      Object.values(views).forEach((v) => v.classList.remove("is-on"));
      views[name].classList.add("is-on");
      active = name;
      await wait(40);
    }

    function previewShelf(text) {
      const need = parseHint(text);
      const figs = els.shelf.querySelectorAll("figure");
      if (!need.shelfCat) {
        els.shelf.classList.remove("is-live");
        figs.forEach((f) => f.classList.remove("is-hot"));
        return;
      }
      els.shelf.classList.add("is-live");
      figs.forEach((f) => f.classList.toggle("is-hot", f.dataset.cat === need.shelfCat));
    }

    async function postChat(message, phase) {
      const res = await fetch(CHAT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          session_id: Cards.sessionId(),
          message,
          product_phase: phase,
        }),
      });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    function factsFromPayload(payload, hint) {
      const rows = [];
      const np = payload.need_profile || {};
      const cats = payload.categories || [];
      const desc = np.need_description || hint.raw;
      rows.push({ k: "İhtiyaç", v: desc.slice(0, 80) || hint.category || "—" });
      const budget = np.budget || {};
      const budgetVal = budget.maximum || budget.value || hint.budget;
      rows.push({ k: "Bütçe", v: money(budgetVal) || "Esnek" });
      if (cats[0] && cats[0].display_name) {
        rows.push({ k: "Kategori", v: cats[0].display_name });
      }
      const path = payload.diagnostics && payload.diagnostics.product_path;
      rows.push({
        k: "Kaynak",
        v: path ? "Ürün kataloğu" : "Kampanya kayıtları",
      });
      return rows;
    }

    function paintOffers(payload) {
      const mapped = Cards.dealsFromChatPayload(payload);
      const n = mapped.deals.length;
      els.offersEyebrow.textContent =
        mapped.source === "catalog" ? "Ürün kataloğu" : "Kampanyalar";
      els.showTitle.textContent =
        n === 0 ? "Sonuç bulunamadı" : `${n} uygun seçenek`;
      const phaseNote =
        mapped.phase === "FINANCE_ENRICHED"
          ? " · tahmini ödeme dahil"
          : mapped.phase === "FIRST_CARDS"
            ? " · finansman yükleniyor olabilir"
            : "";
      els.showSub.textContent =
        n === 0
          ? "Bütçeyi veya ürün tercihini biraz değiştirebilir misin?"
          : `API yanıtı${phaseNote}`;

      if (payload.reply) {
        els.replyBox.hidden = false;
        els.replyBox.textContent = payload.reply;
      } else {
        els.replyBox.hidden = true;
        els.replyBox.textContent = "";
      }

      els.deals.innerHTML = mapped.deals
        .map((d, i) => Cards.dealArticleHtml(d, i))
        .join("");

      if (payload.cta && payload.cta.enabled && payload.cta.label) {
        els.ctaLabel.textContent = payload.cta.label;
      } else {
        els.ctaLabel.textContent = "Üye ol, devam et";
      }
      return mapped;
    }

    async function runShow(text) {
      if (busy) return;
      const hint = parseHint(text);
      if (!hint.raw) return;

      busy = true;
      els.send.disabled = true;
      els.status.textContent = "Okuyor";

      els.readingTitle.textContent = "Anlıyorum…";
      els.facts.innerHTML = [
        { k: "İhtiyaç", v: hint.category || "Yazılan ihtiyaç" },
        { k: "Bütçe", v: money(hint.budget) || "Esnek" },
        { k: "Durum", v: "Katalog sorgulanıyor" },
      ]
        .map(
          (r) =>
            `<div class="fact"><div class="k">${Cards.escapeHtml(r.k)}</div><div class="v">${Cards.escapeHtml(r.v)}</div></div>`
        )
        .join("");

      await showView("reading");
      await wait(80);
      [...els.facts.children].forEach((el, i) => {
        el.style.animationDelay = `${0.08 + i * 0.1}s`;
        el.classList.add("on");
      });

      let payload;
      try {
        els.readingTitle.textContent = "Ürünler aranıyor…";
        els.status.textContent = "Arama";
        // Progressive: first cards, then finance-enriched when catalog path is used.
        payload = await postChat(hint.raw, "FIRST_CARDS");
        if (payload.diagnostics && payload.diagnostics.product_path) {
          els.readingTitle.textContent = "Tahmini ödemeler ekleniyor…";
          payload = await postChat(hint.raw, "FINANCE_ENRICHED");
        }
      } catch (err) {
        busy = false;
        els.send.disabled = false;
        els.status.textContent = "Hata";
        toast("Yanıt alınamadı. API çalışıyor mu?");
        console.error(err);
        await showView("idle");
        return;
      }

      els.facts.innerHTML = factsFromPayload(payload, hint)
        .map(
          (r) =>
            `<div class="fact on"><div class="k">${Cards.escapeHtml(r.k)}</div><div class="v">${Cards.escapeHtml(r.v)}</div></div>`
        )
        .join("");
      await wait(280);

      els.offersHead.classList.remove("on");
      els.cta.classList.remove("on");
      const mapped = paintOffers(payload);

      await showView("offers");
      els.status.textContent =
        mapped.deals.length === 0
          ? "Sonuç yok"
          : mapped.source === "catalog"
            ? `${mapped.deals.length} ürün`
            : `${mapped.deals.length} kampanya`;
      requestAnimationFrame(() => {
        els.offersHead.classList.add("on");
        [...els.deals.children].forEach((el) => el.classList.add("on"));
      });
      await wait(320);
      els.cta.classList.add("on");

      busy = false;
      els.send.disabled = false;
      els.input.focus();
    }

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      runShow(els.input.value);
    });
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        runShow(els.input.value);
      }
    });
    els.input.addEventListener("input", () => {
      if (active === "idle") previewShelf(els.input.value);
      const el = els.input;
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 96) + "px";
    });
    els.signup.addEventListener("click", () =>
      toast("Üyelik akışı yakında bağlanacak · kişisel onay kapalı")
    );
    els.input.focus();
  </script>
</body>
</html>
