<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Taksitlio · İhtiyaç Asistanı</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #9747FF;
      --purple-hover: #8433E8;
      --purple-deep: #6C1ED0;
      --purple-soft: #F4EBFF;
      --lime: #D8FF00;
      --ink: #2A2B2E;
      --ink-muted: #6B7280;
      --ink-faint: #9B9DA1;
      --line: #ECECED;
      --shadow: 0 24px 60px rgba(105, 40, 200, 0.14);
      --font: "Sora", system-ui, sans-serif;
      --display: "Outfit", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background:
        radial-gradient(1100px 560px at 12% -8%, rgba(151, 71, 255, 0.22), transparent 55%),
        radial-gradient(900px 500px at 92% 0%, rgba(216, 255, 0, 0.10), transparent 45%),
        linear-gradient(180deg, #F7F3FF 0%, #FAFAFA 42%, #F0F1F4 100%);
    }

    .shell { width: min(440px, 100%); }

    .phone {
      width: 100%;
      border-radius: 40px;
      overflow: hidden;
      border: 10px solid #1C1C1E;
      box-shadow: var(--shadow);
      background: #F7F7F8;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 96px; height: 22px; border-radius: 0 0 14px 14px;
      background: #1C1C1E; z-index: 5;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: min(780px, calc(100vh - 80px));
      min-height: 640px;
      background:
        radial-gradient(520px 240px at 50% -10%, rgba(151,71,255,0.16), transparent 60%),
        linear-gradient(180deg, #FBFAFF 0%, #F6F6F8 100%);
    }

    .guest-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 34px 16px 12px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(42,43,46,0.05);
    }
    .wordmark { height: 16px; width: auto; display: block; }
    .guest-pill {
      font-size: 11px; font-weight: 700; color: var(--purple-deep);
      background: var(--purple-soft); padding: 6px 10px; border-radius: 999px;
    }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--ink-muted); font-size: 11px; font-weight: 500; margin-top: 4px;
    }
    .status i {
      width: 7px; height: 7px; border-radius: 50%; background: #22C55E;
      display: inline-block;
    }

    .stage {
      padding: 16px 16px 8px;
      overflow: auto;
      scroll-behavior: smooth;
    }

    /* PROMPT-FIRST STAGE — not a WhatsApp clone */
    .brief {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100%;
    }

    .hero {
      text-align: center;
      padding: 28px 8px 8px;
      transition: opacity .35s ease, transform .35s ease;
    }
    .hero.compact {
      padding: 8px 4px 0;
    }
    .hero.compact .hero-mark { width: 44px; height: 44px; margin-bottom: 10px; border-radius: 14px; }
    .hero.compact .hero-mark img { width: 24px; height: 24px; }
    .hero.compact h1 { font-size: 18px; margin-bottom: 4px; }
    .hero.compact p { display: none; }

    .hero-mark {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px;
      background: linear-gradient(145deg, #A66BFF, var(--purple-deep));
      display: grid; place-items: center;
      box-shadow: 0 16px 40px rgba(151,71,255,0.35);
      position: relative;
    }
    .hero-mark img {
      width: 36px; height: 36px; object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .hero-mark::before {
      content: ""; position: absolute; top: -3px; right: -2px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--lime);
      box-shadow: 0 0 0 4px rgba(216,255,0,0.18);
    }
    .hero h1 {
      font-family: var(--display); font-size: 28px; letter-spacing: -0.035em;
      margin: 0 0 10px; line-height: 1.2; font-weight: 700;
    }
    .hero p {
      margin: 0 auto; color: var(--ink-muted); line-height: 1.5;
      max-width: 32ch; font-size: 13.5px;
    }

    .letter {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .turn {
      animation: rise .35s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .bot-line {
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink);
      padding: 14px 16px;
      background: white;
      border: 1px solid rgba(42,43,46,0.06);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(42,43,46,0.05);
    }
    .bot-line strong { color: var(--purple-deep); }

    .user-line {
      align-self: stretch;
      font-size: 14px;
      line-height: 1.55;
      color: white;
      padding: 14px 16px;
      background: linear-gradient(135deg, #A15CFF, var(--purple));
      border-radius: 18px;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 24px rgba(151,71,255,0.25);
      white-space: pre-wrap;
    }

    .typing {
      display: inline-flex; gap: 4px; align-items: center; padding: 2px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--purple);
      animation: bounce 1.1s ease infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .campaign {
      background: white;
      border: 1px solid rgba(42,43,46,0.06);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(42,43,46,0.05);
      position: relative;
      animation: rise .4s ease both;
    }
    .campaign.best {
      background: linear-gradient(180deg, rgba(216,255,0,0.10), white 36%);
    }
    .campaign.best::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--lime);
    }
    .camp-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 10px; padding: 14px 14px 8px;
    }
    .camp-brand { font-weight: 700; font-size: 14px; }
    .camp-meta { color: var(--ink-muted); font-size: 12px; margin-top: 3px; line-height: 1.4; }
    .badge {
      font-size: 10px; font-weight: 800; letter-spacing: .02em;
      text-transform: uppercase; padding: 5px 8px; border-radius: 999px;
      background: var(--lime); color: var(--ink); white-space: nowrap;
    }
    .badge.soft { background: var(--purple-soft); color: var(--purple-deep); }
    .camp-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 4px 14px 12px;
    }
    .stat { background: #FAFAFA; border-radius: 12px; padding: 10px 12px; }
    .stat .l { font-size: 10px; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; }
    .stat .n { font-size: 15px; font-weight: 700; margin-top: 3px; }
    .stat .n.purple { color: var(--purple); }
    .camp-foot {
      padding: 0 14px 14px; font-size: 12px; color: var(--ink-muted); font-weight: 500;
    }

    .cta-card {
      background: linear-gradient(145deg, #7A35F0 0%, #9747FF 50%, #5B17C4 100%);
      color: white; border-radius: 20px; padding: 16px;
      box-shadow: 0 16px 36px rgba(151,71,255,0.28);
      position: relative; overflow: hidden;
      animation: rise .45s ease both;
    }
    .cta-card::after {
      content: ""; position: absolute; right: -30px; top: -30px;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(216,255,0,0.16);
    }
    .cta-card h3 {
      position: relative; margin: 0 0 6px; font-family: var(--display);
      font-size: 18px; letter-spacing: -0.02em;
    }
    .cta-card p {
      position: relative; margin: 0 0 14px; font-size: 12.5px;
      line-height: 1.45; opacity: .9;
    }
    .btn-lime {
      position: relative;
      appearance: none; border: 0; width: 100%; cursor: pointer;
      background: var(--lime); color: var(--ink);
      font: inherit; font-size: 13px; font-weight: 800;
      padding: 12px 16px; border-radius: 999px;
      box-shadow: 0 10px 22px rgba(216,255,0,0.35);
    }

    /* PROMPT PAD — the product */
    .prompt-pad {
      padding: 10px 14px 20px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.92) 22%);
    }
    .prompt-shell {
      background: white;
      border-radius: 22px;
      border: 1.5px solid rgba(151,71,255,0.18);
      box-shadow:
        0 16px 40px rgba(151,71,255,0.12),
        0 0 0 5px rgba(151,71,255,0.05);
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .prompt-shell:focus-within {
      border-color: var(--purple);
      box-shadow:
        0 18px 44px rgba(151,71,255,0.18),
        0 0 0 6px rgba(151,71,255,0.1);
    }
    .prompt-shell textarea {
      display: block;
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
      color: var(--ink);
      padding: 16px 16px 8px;
      min-height: 84px;
      background: transparent;
    }
    .prompt-shell textarea::placeholder { color: var(--ink-faint); }
    .prompt-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px 10px 16px;
    }
    .prompt-guide {
      font-size: 11px;
      color: var(--ink-faint);
      line-height: 1.35;
      max-width: 70%;
    }
    .send {
      width: 46px; height: 46px; border: 0; border-radius: 50%;
      background: linear-gradient(145deg, #A66BFF, var(--purple));
      color: white; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 10px 22px rgba(151,71,255,0.35);
      flex-shrink: 0;
      transition: transform .15s;
    }
    .send:hover { transform: scale(1.05); }
    .send:disabled { opacity: .55; cursor: wait; transform: none; }
    .send svg { width: 17px; height: 17px; fill: white; }
    .send::after {
      content: ""; position: absolute;
      /* kept simple */
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: white; padding: 12px 18px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2); opacity: 0;
      pointer-events: none; transition: opacity .25s, transform .25s;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="phone" aria-label="Taksitlio ihtiyaç asistanı">
      <div class="app">
        <header class="guest-bar">
          <div>
            <img class="wordmark" src="assets/logowithlabel.png" alt="taksitlio" />
            <div class="status"><i></i> <span id="statusText">Misafir asistan</span></div>
          </div>
          <div class="guest-pill">Giriş yapmadan</div>
        </header>

        <main class="stage" id="stage">
          <div class="brief">
            <div class="hero" id="hero">
              <div class="hero-mark"><img src="assets/favicon.png" alt="" /></div>
              <h1>Merhaba</h1>
              <p>Üye olmadan ihtiyaç analizi yapayım. Ne almak istediğini ve bütçeni kendi cümlelerinle yaz.</p>
            </div>
            <div class="letter" id="letter">
              <div class="turn">
                <div class="bot-line">
                  Senin için hızlı bir <strong>ihtiyaç analizi</strong> yapayım mı?
                  Aşağıya serbestçe yazman yeterli — tıklanacak menü yok.
                </div>
              </div>
            </div>
          </div>
        </main>

        <footer class="prompt-pad">
          <form id="promptForm" autocomplete="off">
            <div class="prompt-shell">
              <textarea
                id="promptInput"
                rows="3"
                maxlength="500"
                placeholder="Örn. cep telefonu alıcaz, bütçem 40 bin TL civarı…"
                aria-label="İhtiyaç metnin"
              ></textarea>
              <div class="prompt-bar">
                <div class="prompt-guide" id="promptGuide">Yazıp gönder — eksikse sorarım, sen yine yazarsın</div>
                <button class="send" type="submit" id="sendBtn" aria-label="Gönder">
                  <svg viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
                </button>
              </div>
            </div>
          </form>
        </footer>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const DEMO_CAMPAIGNS = [
      {
        best: true,
        brand: "Samsung Galaxy A56",
        meta: "MediaMarkt × Yapı Kredi · 0 faiz fırsatı",
        badge: "En uygun",
        monthly: "3.249 TL",
        tenure: "12 ay",
        total: "Toplam ≈ 38.990 TL",
      },
      {
        best: false,
        brand: "iPhone 15 128GB",
        meta: "Vatan × Akbank · peşinatlı taksit",
        badge: "Alternatif",
        monthly: "3.499 TL",
        tenure: "12 ay",
        total: "Toplam ≈ 41.990 TL",
      },
    ];

    const els = {
      status: document.getElementById("statusText"),
      stage: document.getElementById("stage"),
      hero: document.getElementById("hero"),
      letter: document.getElementById("letter"),
      form: document.getElementById("promptForm"),
      input: document.getElementById("promptInput"),
      send: document.getElementById("sendBtn"),
      guide: document.getElementById("promptGuide"),
      toast: document.getElementById("toast"),
    };

    let busy = false;
    let offersShown = false;
    const state = { category: null, budget: null, brand: null, awaiting: null };

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function setBusy(v) {
      busy = v;
      els.send.disabled = v;
      els.input.disabled = v;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function scrollEnd() {
      requestAnimationFrame(() => {
        els.stage.scrollTop = els.stage.scrollHeight;
      });
    }

    function appendUser(text) {
      const wrap = document.createElement("div");
      wrap.className = "turn";
      wrap.innerHTML = `<div class="user-line">${escapeHtml(text)}</div>`;
      els.letter.appendChild(wrap);
      scrollEnd();
    }

    function appendBot(html) {
      const wrap = document.createElement("div");
      wrap.className = "turn";
      wrap.innerHTML = `<div class="bot-line">${html}</div>`;
      els.letter.appendChild(wrap);
      scrollEnd();
    }

    function appendTyping() {
      const id = `t-${Date.now()}`;
      const wrap = document.createElement("div");
      wrap.className = "turn";
      wrap.id = id;
      wrap.innerHTML = `<div class="bot-line"><span class="typing"><span></span><span></span><span></span></span></div>`;
      els.letter.appendChild(wrap);
      scrollEnd();
      return id;
    }

    function removeTyping(id) {
      document.getElementById(id)?.remove();
    }

    function parseBudget(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      let m = lower.match(/(\d+[.,]?\d*)\s*(bin|k)\b/);
      if (m) return Math.round(parseFloat(m[1].replace(",", ".")) * 1000);
      m = lower.match(/(\d{1,3}(?:[.,]\d{3})+|\d{4,7})\s*(tl|₺)?/);
      if (m) {
        const n = parseInt(m[1].replace(/[.,]/g, ""), 10);
        if (n >= 1000) return n;
      }
      return null;
    }

    function parseCategory(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      if (/telefon|iphone|samsung|xiaomi|huawei|oppo|cep\s*telefon|android/.test(lower)) return "phone";
      if (/buzdolab|çamaşır|bulas[ıi]k|bulaşık|beyaz\s*eşya|klima|fırın/.test(lower)) return "appliance";
      if (/koltuk|masa|yatak|mobilya|dolap/.test(lower)) return "furniture";
      return null;
    }

    function parseBrand(text) {
      const lower = text.toLocaleLowerCase("tr-TR");
      if (/iphone|apple/.test(lower)) return "iphone";
      if (/samsung|galaxy/.test(lower)) return "samsung";
      if (/fark\s*etmez|herhangi|olur|önemli değil/.test(lower)) return "any";
      return null;
    }

    function mergeFromText(text) {
      const cat = parseCategory(text);
      const budget = parseBudget(text);
      const brand = parseBrand(text);
      if (cat) state.category = cat;
      if (budget) state.budget = budget;
      if (brand) state.brand = brand;
    }

    function categoryLabel(c) {
      return ({ phone: "cep telefonu", appliance: "beyaz eşya", furniture: "mobilya", other: "alışveriş" }[c] || "ürün");
    }

    function budgetLabel(n) {
      return `${n.toLocaleString("tr-TR")} TL`;
    }

    function nextQuestion() {
      if (!state.category) {
        state.awaiting = "category";
        return "Ne almak istiyorsun? Kısa da yazsan olur — örneğin telefon, buzdolabı, koltuk…";
      }
      if (!state.budget) {
        state.awaiting = "budget";
        return `${categoryLabel(state.category)} için yaklaşık bütçen ne kadar? Rakam yazman yeterli.`;
      }
      if (state.category === "phone" && !state.brand) {
        state.awaiting = "brand";
        return "Marka tercihin var mı? Yoksa “fark etmez” yaz, bütçene göre getireyim.";
      }
      state.awaiting = null;
      return null;
    }

    function campaignHtml(c, delay) {
      return `
        <div class="campaign ${c.best ? "best" : ""}" style="animation-delay:${delay}s">
          <div class="camp-top">
            <div>
              <div class="camp-brand">${escapeHtml(c.brand)}</div>
              <div class="camp-meta">${escapeHtml(c.meta)}</div>
            </div>
            <span class="badge ${c.best ? "" : "soft"}">${escapeHtml(c.badge)}</span>
          </div>
          <div class="camp-stats">
            <div class="stat"><div class="l">Aylık</div><div class="n purple">${escapeHtml(c.monthly)}</div></div>
            <div class="stat"><div class="l">Vade</div><div class="n">${escapeHtml(c.tenure)}</div></div>
          </div>
          <div class="camp-foot">${escapeHtml(c.total)}</div>
        </div>`;
    }

    function showOffers() {
      const budgetText = budgetLabel(state.budget || 40000);
      const wrap = document.createElement("div");
      wrap.className = "turn";
      wrap.innerHTML = `
        <div class="bot-line" style="margin-bottom:12px">
          Bankalar ve markalar arasındaki güncel kampanyaları taradım.
          <strong>${escapeHtml(budgetText)}</strong> bütçene en uygun 2 seçenek:
        </div>
        <div style="display:grid;gap:10px">
          ${DEMO_CAMPAIGNS.map((c, i) => campaignHtml(c, 0.05 + i * 0.08)).join("")}
          <div class="cta-card" style="animation-delay:.2s">
            <h3>Üye ol, kampanyadan yararlan</h3>
            <p>Bu teklifleri kilitlemek ve başvuruya devam etmek için ücretsiz üye olman yeterli. Limit sorgulama da üyelikle açılır.</p>
            <button class="btn-lime" type="button" id="btnSignup">Üye ol · 30 saniye</button>
          </div>
        </div>`;
      els.letter.appendChild(wrap);
      document.getElementById("btnSignup").onclick = () =>
        showToast("Üyelik akışı yakında BE’ye bağlanacak");
      offersShown = true;
      els.status.textContent = "2 kampanya bulundu";
      els.guide.textContent = "Başka bir ihtiyaç yazabilirsin";
      els.input.placeholder = "Başka bir ihtiyaç yaz…";
      scrollEnd();
    }

    async function wait(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function respond() {
      const typing = appendTyping();
      await wait(650);
      removeTyping(typing);

      const q = nextQuestion();
      if (q) {
        els.status.textContent = "Biraz daha yazmanı bekliyorum";
        appendBot(q);
        els.guide.textContent =
          state.awaiting === "budget"
            ? "Örn. 40 bin veya 40000 yaz"
            : state.awaiting === "brand"
              ? "Örn. Samsung / iPhone / fark etmez"
              : "Ne almak istediğini yaz";
        return;
      }

      appendBot("Anladım. Kampanyaları tarıyorum…");
      els.status.textContent = "Kampanyalar taranıyor";
      await wait(800);
      showOffers();
    }

    async function handlePrompt(raw) {
      const text = raw.trim();
      if (!text || busy) return;

      els.hero.classList.add("compact");
      appendUser(text);
      els.input.value = "";
      autosize();
      setBusy(true);
      els.status.textContent = "Dinliyorum";

      if (offersShown) {
        // new search cycle
        offersShown = false;
        state.category = null;
        state.budget = null;
        state.brand = null;
        state.awaiting = null;
      }

      if (state.awaiting === "budget") {
        const n = parseBudget(text);
        if (n) state.budget = n;
        else if (/^\d[\d.,]*$/.test(text)) {
          let v = parseInt(text.replace(/[.,]/g, ""), 10);
          if (v < 1000) v *= 1000;
          state.budget = v;
        }
      } else if (state.awaiting === "category") {
        const c = parseCategory(text);
        state.category = c || "other";
      } else if (state.awaiting === "brand") {
        state.brand = parseBrand(text) || "any";
      } else {
        mergeFromText(text);
      }

      await respond();
      setBusy(false);
      els.input.focus();
    }

    function autosize() {
      const el = els.input;
      el.style.height = "auto";
      el.style.height = Math.min(160, Math.max(84, el.scrollHeight)) + "px";
    }

    els.input.addEventListener("input", autosize);
    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      handlePrompt(els.input.value);
    });
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handlePrompt(els.input.value);
      }
    });

    autosize();
    els.input.focus();
  </script>
</body>
</html>
