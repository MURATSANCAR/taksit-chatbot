<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Taksitlio · İhtiyaç Asistanı</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #9747FF;
      --purple-deep: #6C1ED0;
      --purple-soft: #F1E8FF;
      --lime: #D8FF00;
      --ink: #1E1F22;
      --muted: #6F737A;
      --line: rgba(30, 31, 34, 0.08);
      --bubble-bot: #FFFFFF;
      --bubble-user: #9747FF;
      --bg: #F5F3F8;
      --surface: #FFFFFF;
      --font: "Figtree", system-ui, sans-serif;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --shell-max: 390px;
      --app-radius: 0;
      --phone-border: 0;
      --frame-pad: 0px;
      --top-pad-extra: 8px;
      --space: clamp(12px, 3.2vw, 16px);
      --bubble-max: min(86%, 34rem);
      --fs-body: clamp(13.5px, 3.6vw, 15px);
      --fs-title: clamp(24px, 7vw, 34px);
      --fs-showroom: clamp(22px, 5.5vw, 28px);
      --fs-price: clamp(22px, 5.5vw, 28px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: stretch;
      padding: 0;
      background: var(--bg);
      overflow: hidden;
    }

    .shell {
      width: 100%;
      max-width: none;
      height: 100%;
      min-height: 100dvh;
      min-height: var(--vvh, 100dvh);
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .phone {
      width: 100%;
      flex: 1;
      min-height: 0;
      border-radius: var(--app-radius);
      overflow: hidden;
      border: var(--phone-border) solid #141416;
      background: var(--bg);
      box-shadow: none;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone::before { display: none; }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      flex: 1;
      min-height: 0;
      height: 100%;
      width: 100%;
      background: var(--bg);
      position: relative;
    }

    #fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .app.flash::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 24;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 42%,
        rgba(216, 255, 0, 0.28),
        rgba(151, 71, 255, 0.12) 38%,
        transparent 68%
      );
      animation: canvasFlash .55s ease forwards;
    }
    @keyframes canvasFlash {
      0% { opacity: 0; }
      28% { opacity: 1; }
      100% { opacity: 0; }
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding:
        calc(var(--top-pad-extra) + var(--safe-top) + 10px)
        calc(var(--space) + var(--safe-right))
        10px
        calc(var(--space) + var(--safe-left));
      background: rgba(245, 243, 248, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid transparent;
      position: relative;
      z-index: 5;
    }
    .top.scrolled { border-bottom-color: var(--line); }
    .wordmark {
      height: clamp(14px, 3.8vw, 16px);
      width: auto;
      max-width: min(46vw, 160px);
      object-fit: contain;
      display: block;
    }
    .guest {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(10px, 2.8vw, 11px);
      font-weight: 700;
      color: var(--purple-deep);
      background: var(--purple-soft);
      border: 1px solid rgba(151, 71, 255, 0.18);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .guest svg { width: 12px; height: 12px; fill: currentColor; flex: none; }

    .thread {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 8px calc(var(--space) + var(--safe-right)) 18px calc(var(--space) + var(--safe-left));
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      min-height: 0;
    }
    .thread::-webkit-scrollbar { display: none; }

    .welcome {
      text-align: center;
      padding: clamp(12px, 4vw, 22px) 6px 8px;
      animation: rise .55s cubic-bezier(.22,1,.36,1) both;
    }
    .welcome h1 {
      font-family: var(--display);
      font-size: var(--fs-title);
      font-weight: 800;
      letter-spacing: -0.045em;
      margin: 14px 0 8px;
      line-height: 1.1;
    }
    .welcome p {
      margin: 0 auto;
      max-width: 36ch;
      color: var(--muted);
      font-size: clamp(13px, 3.5vw, 14.5px);
      line-height: 1.45;
      padding: 0 4px;
    }
    .welcome-ai {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 320px);
      margin: 0 auto;
      padding: clamp(14px, 4vw, 18px) clamp(16px, 5vw, 24px) 14px;
      border-radius: clamp(20px, 5vw, 28px);
      background:
        linear-gradient(165deg, rgba(255,255,255,0.92), rgba(244,235,255,0.88));
      border: 1px solid rgba(151, 71, 255, 0.14);
      box-shadow:
        0 18px 40px rgba(151, 71, 255, 0.12),
        0 2px 0 rgba(255,255,255,0.9) inset;
      overflow: hidden;
      isolation: isolate;
      animation: aiPop .7s cubic-bezier(.22,1,.36,1) .12s both;
    }
    .welcome-ai::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 0%, rgba(151,71,255,.18), transparent 46%),
        radial-gradient(circle at 88% 100%, rgba(216,255,0,.16), transparent 42%);
      pointer-events: none;
      z-index: 0;
    }
    .welcome-ai::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255,255,255,.55) 48%,
        transparent 64%
      );
      transform: translateX(-120%);
      animation: aiShine 3.2s ease-in-out 1s infinite;
      pointer-events: none;
      z-index: 1;
    }
    .welcome-ai .label {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      gap: 6px;
      line-height: 1;
    }
    .welcome-ai .brand-line {
      font-family: var(--display);
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #2A2B2E;
      text-align: center;
      width: 100%;
    }
    .welcome-ai .brand-line .pi,
    .welcome-ai .brand-line .po {
      color: var(--purple);
    }
    .welcome-ai .ai-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--purple-deep);
      background: rgba(216, 255, 0, 0.55);
      padding: 6px 12px;
      border-radius: 999px;
      text-align: center;
    }
    @keyframes aiShine {
      0%, 55%, 100% { transform: translateX(-120%); }
      70% { transform: translateX(120%); }
    }
    @keyframes aiPop {
      from { opacity: 0; transform: translateY(8px) scale(.94); }
      to { opacity: 1; transform: none; }
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 100%;
      animation: bubbleIn .42s cubic-bezier(.22,1,.36,1) both;
    }
    .row.user { justify-content: flex-end; animation-name: bubbleInRight; }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(2px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    @keyframes bubbleInRight {
      from { opacity: 0; transform: translate(12px, 10px) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(145deg, #A66BFF, var(--purple));
      display: grid; place-items: center; flex: none;
      box-shadow: 0 6px 14px rgba(151, 71, 255, 0.28);
    }
    .avatar img {
      width: 14px; height: 14px;
      filter: brightness(0) invert(1);
    }

    .bubble {
      max-width: var(--bubble-max);
      padding: 11px 13px;
      border-radius: 18px;
      font-size: var(--fs-body);
      line-height: 1.4;
      box-shadow: 0 8px 20px rgba(30, 31, 34, 0.05);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .bubble.bot {
      background: var(--bubble-bot);
      color: var(--ink);
      border-bottom-left-radius: 6px;
      border: 1px solid var(--line);
    }
    .bubble.user {
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 22px rgba(151, 71, 255, 0.25);
    }
    .bubble .who {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--purple);
      margin-bottom: 4px;
    }
    .bubble.typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 14px 16px;
      min-width: 56px;
    }
    .bubble.typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: #C4B5E0;
      animation: dot 1s ease infinite;
    }
    .bubble.typing i:nth-child(2) { animation-delay: .15s; }
    .bubble.typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot {
      0%, 80%, 100% { transform: translateY(0); opacity: .45; }
      40% { transform: translateY(-3px); opacity: 1; }
    }

    /* Showroom block inside thread */
    .showroom {
      margin: 4px 0 2px;
      animation: showroomIn .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes showroomIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .showroom-head {
      padding: 6px 2px 12px;
      animation: rise .45s cubic-bezier(.22,1,.36,1) both;
    }
    .showroom-head .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple-deep);
      margin-bottom: 6px;
    }
    .showroom-head h2 {
      font-family: var(--display);
      font-size: var(--fs-showroom);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 4px;
      line-height: 1.1;
    }
    .showroom-head p {
      margin: 0;
      color: var(--purple);
      font-size: 13px;
      font-weight: 600;
    }

    .offer,
    .deal {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 12px;
      background: var(--surface);
      border-radius: clamp(16px, 4vw, 20px);
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(30, 31, 34, 0.04);
      opacity: 0;
      transform: translateY(18px) scale(.97);
      filter: blur(2px);
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
      isolation: isolate;
    }
    .offer.on,
    .deal.on {
      animation: offerIn .55s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes offerIn {
      to { opacity: 1; transform: none; filter: none; }
    }
    .offer.best,
    .deal.best {
      border-color: rgba(151, 71, 255, 0.28);
      box-shadow: 0 14px 32px rgba(151, 71, 255, 0.1);
    }
    .offer-media,
    .deal-media {
      position: relative;
      flex: 0 0 96px;
      width: 96px;
      min-width: 96px;
      max-width: 96px;
      align-self: stretch;
      min-height: 96px;
      border-radius: 14px;
      overflow: hidden;
      background: #EEEAF4;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offer-media img,
    .deal-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 0;
    }
    .deal-media.is-empty {
      padding: 28px 8px 10px;
    }
    .deal-media-ph {
      position: relative;
      z-index: 0;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
      max-width: 100%;
    }
    .deal-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 2;
      width: max-content;
      max-width: calc(100% - 12px);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(30, 31, 34, 0.12);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    .offer-body,
    .deal-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding: 0;
    }
    .deal-copy { min-width: 0; }
    .offer-top,
    .deal-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }
    .offer-name,
    .deal-name {
      font-size: clamp(13px, 3.5vw, 14.5px);
      font-weight: 750;
      letter-spacing: -0.02em;
      line-height: 1.3;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .offer-meta,
    .deal-meta {
      margin-top: 4px;
      font-size: clamp(11px, 2.9vw, 12px);
      color: var(--muted);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .deal-meta-logos {
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      min-width: 0;
      flex-wrap: nowrap;
      overflow: hidden;
      white-space: nowrap;
    }
    .deal-meta-logos .meta-entity {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 0;
      min-width: 0;
      max-width: 48%;
      overflow: hidden;
    }
    .deal-meta-logos .meta-logo {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: #fff;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .deal-meta-logos .meta-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .deal-meta-logos .meta-dot {
      flex: 0 0 auto;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(80, 70, 100, 0.35);
    }
    .deal-meta-logos .meta-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      color: var(--muted);
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    .deal-meta-logos > .meta-text {
      flex: 1 1 0;
      max-width: 48%;
    }
    .deal-meta-logos .meta-pill {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.01em;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(151, 71, 255, 0.1);
      color: var(--purple-deep);
      line-height: 1.2;
    }
    .partial-card .deal-meta-logos {
      margin: 4px 0 2px;
    }
    .pill {
      flex: none;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      white-space: nowrap;
    }
    .pill.soft {
      background: var(--purple-soft);
      color: var(--purple-deep);
    }
    .offer-price,
    .deal-price {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .offer-price .label,
    .deal-price .l {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.2;
    }
    .offer-price .n,
    .deal-price .n {
      font-family: var(--display);
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      letter-spacing: -0.045em;
      color: var(--purple);
      line-height: 1.1;
    }
    .deal-price .hint {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .deal-finance {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(151, 71, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .deal-finance .fl {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.2;
    }
    .deal-finance .fn {
      font-family: var(--display);
      font-size: clamp(15px, 3.8vw, 18px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.15;
    }
    .offer-price .foot {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
    }

    .cta-card {
      margin-top: 4px;
      background: var(--ink);
      color: #fff;
      border-radius: 18px;
      padding: 14px;
      display: grid;
      gap: 10px;
      opacity: 0;
      transform: translateY(16px) scale(.97);
    }
    .cta-card.on {
      animation: offerIn .55s cubic-bezier(.22,1,.36,1) forwards;
    }
    .cta-card p {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      color: rgba(255,255,255,0.72);
    }
    .cta-card strong {
      display: block;
      color: #fff;
      font-size: 14.5px;
      font-weight: 750;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .cta-btn {
      appearance: none;
      border: 0;
      width: 100%;
      cursor: pointer;
      background: var(--lime);
      color: var(--ink);
      font: inherit;
      font-size: 13.5px;
      font-weight: 800;
      padding: 13px 14px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cta-btn:active { transform: scale(0.985); }

    .constraint-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 4px;
    }
    .constraint-chips .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .constraint-chips .chip:hover {
      border-color: rgba(151, 71, 255, 0.35);
      background: var(--purple-soft);
    }

    .prompt-suggestions {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin: 2px 0 6px 36px;
      max-width: calc(var(--bubble-max) + 8px);
      animation: bubbleIn .42s cubic-bezier(.22,1,.36,1) both;
      animation-delay: .08s;
    }
    .prompt-suggestions .suggest {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 16px;
      padding: 10px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(30, 31, 34, 0.04);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .prompt-suggestions .suggest:hover {
      border-color: rgba(151, 71, 255, 0.35);
      background: var(--purple-soft);
    }
    .prompt-suggestions .suggest:active {
      transform: scale(0.985);
    }
    .prompt-suggestions .suggest .suggest-label {
      display: block;
      font-size: 10.5px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .prompt-suggestions .suggest .suggest-text {
      color: var(--purple-deep);
    }
    .search-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 4px;
    }
    .search-controls button,
    .search-feedback .feedback-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      background: var(--purple-soft);
      color: var(--purple-deep);
    }
    .search-controls button[data-act="cancel"] {
      background: rgba(30, 31, 34, 0.06);
      color: var(--muted);
    }
    .search-feedback {
      margin: 6px 0 10px;
    }
    .search-feedback .feedback-thanks {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
    .partial-products {
      margin: 8px 0;
      width: 100%;
      min-width: 0;
    }
    .partial-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .partial-carousel {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      overflow: hidden;
      padding-bottom: 0;
      margin: 0;
    }
    .partial-products[data-cols="2"] .partial-carousel {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .partial-card {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    .partial-card.is-featured {
      border-color: rgba(151, 71, 255, 0.32);
      box-shadow: 0 10px 22px rgba(151, 71, 255, 0.1);
    }
    .partial-media {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #EEEAF4;
    }
    .partial-card img,
    .partial-card .skeleton {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #EEEAF4;
    }
    .partial-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(30, 31, 34, 0.12);
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .partial-card h4 {
      margin: 8px 0 2px;
      font-size: clamp(11.5px, 3vw, 13px);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .partial-card p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .partial-card .partial-price {
      margin-top: 4px;
      color: var(--purple);
      font-weight: 800;
      font-size: clamp(12px, 3.2vw, 13px);
    }
    .partial-card .partial-finance {
      margin-top: 2px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
    }
    .partial-card .partial-finance-hint {
      display: block;
      margin-top: 1px;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
    }

    @media (max-width: 360px) {
      .partial-carousel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .clarification-card {
      background: var(--surface);
      border: 1px solid rgba(151, 71, 255, 0.18);
      border-radius: 18px;
      padding: clamp(12px, 3vw, 14px);
      margin: 6px 0 8px;
      box-shadow: 0 10px 24px rgba(151, 71, 255, 0.06);
    }
    .clarification-card p {
      margin: 0 0 12px;
      font-size: var(--fs-body);
      line-height: 1.4;
      font-weight: 650;
    }
    .clarification-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .clarification-options button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--purple-soft);
      color: var(--purple-deep);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: clamp(12px, 3.2vw, 13px);
      font-weight: 700;
      cursor: pointer;
      max-width: 100%;
      text-align: left;
    }
    .clarification-options button:active {
      transform: scale(0.98);
    }

    .search-progress-timeline {
      list-style: none;
      margin: 6px 0 8px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      display: grid;
      gap: 0;
      overflow: hidden;
    }
    .search-progress-timeline li {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      font-size: clamp(12px, 3.1vw, 13.5px);
      color: var(--muted);
      line-height: 1.35;
      padding: 8px 2px;
      position: relative;
      opacity: 0.55;
      transform: translateY(6px);
    }
    .search-progress-timeline li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 28px;
      bottom: -2px;
      width: 2px;
      border-radius: 2px;
      background: linear-gradient(
        180deg,
        rgba(151, 71, 255, 0.28),
        rgba(151, 71, 255, 0.06)
      );
    }
    .search-progress-timeline li.done {
      color: var(--ink);
      font-weight: 650;
      opacity: 1;
      transform: none;
    }
    .search-progress-timeline li.active {
      color: var(--purple-deep);
      font-weight: 750;
      opacity: 1;
      transform: none;
    }
    .search-progress-timeline li.pending {
      opacity: 0.42;
    }
    .search-progress-timeline .mark {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
      color: var(--purple);
      background: var(--purple-soft);
      border: 1px solid rgba(151, 71, 255, 0.18);
      position: relative;
      z-index: 1;
    }
    .search-progress-timeline li.done .mark {
      background: var(--lime);
      color: var(--ink);
      border-color: rgba(30, 31, 34, 0.08);
    }
    .search-progress-timeline li.active .mark {
      background: var(--purple);
      color: #fff;
      box-shadow: 0 0 0 4px rgba(151, 71, 255, 0.16);
      animation: stepPulse 1.15s ease-in-out infinite;
    }
    .search-progress-timeline .step-text {
      padding-top: 2px;
    }
    .search-progress-timeline li.step-enter {
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      filter: blur(2px);
    }
    .search-progress-timeline li.step-enter-on {
      animation: stepEnter 0.48s cubic-bezier(.22,1,.36,1) forwards;
      animation-delay: calc(var(--step-i, 0) * 70ms);
    }
    .search-progress-timeline li.step-pop .mark {
      animation: stepPop 0.42s cubic-bezier(.22,1,.36,1);
    }
    @keyframes stepEnter {
      to { opacity: 1; transform: none; filter: none; }
    }
    @keyframes stepPop {
      0% { transform: scale(0.7); }
      55% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    @keyframes stepPulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(151, 71, 255, 0.14); }
      50% { box-shadow: 0 0 0 8px rgba(151, 71, 255, 0.08); }
    }

    .logo-progress-rail {
      display: grid;
      gap: 8px;
      margin: 6px 0 8px;
    }
    .logo-progress-rail .logo-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo-progress-rail img,
    .logo-progress-rail .logo-fallback {
      width: clamp(36px, 9vw, 44px);
      height: clamp(36px, 9vw, 44px);
      border-radius: 10px;
      object-fit: contain;
      background: var(--surface);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--purple-deep);
    }

    .composer {
      padding:
        10px
        calc(12px + var(--safe-right))
        calc(12px + var(--safe-bottom))
        calc(12px + var(--safe-left));
      background: linear-gradient(180deg, transparent, rgba(245,243,248,0.96) 28%);
      position: relative;
      z-index: 5;
    }
    .composer-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 7px;
      box-shadow: 0 12px 30px rgba(30, 31, 34, 0.06);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer-box:focus-within {
      border-color: rgba(151, 71, 255, 0.45);
      box-shadow:
        0 12px 30px rgba(151, 71, 255, 0.1),
        0 0 0 3px rgba(151, 71, 255, 0.08);
    }
    .composer-box textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font: inherit;
      font-size: clamp(14px, 3.8vw, 15.5px);
      line-height: 1.4;
      color: var(--ink);
      padding: 10px 10px;
      min-height: 44px;
      max-height: min(30vh, 140px);
    }
    .composer-box textarea::placeholder { color: #A0A3A9; }
    .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--lime);
      color: var(--ink);
      display: grid;
      place-items: center;
      transition: transform .15s ease, background .15s ease;
      flex: none;
      touch-action: manipulation;
    }
    .send:hover { background: #c9ef00; }
    .send:active { transform: scale(0.95); }
    .send:disabled { opacity: 0.45; cursor: wait; }
    .send svg { width: 16px; height: 16px; fill: currentColor; }

    .toast {
      position: fixed;
      bottom: calc(22px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: min(92vw, 420px);
      background: var(--ink);
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: clamp(12px, 3.3vw, 13.5px);
      font-weight: 600;
      opacity: 0;
      transition: .25s;
      z-index: 40;
      pointer-events: none;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    /* Very narrow phones: keep side-by-side, slightly tighter media */
    @media (max-width: 360px) {
      .offer,
      .deal { gap: 10px; padding: 10px; }
      .offer-media,
      .deal-media {
        flex-basis: 84px;
        width: 84px;
        min-width: 84px;
        max-width: 84px;
        min-height: 84px;
      }
    }

    /* Landscape phones / short viewports */
    @media (max-height: 560px) {
      .welcome { padding-top: 8px; }
      .welcome h1 { margin-top: 10px; }
      .welcome-ai { padding-top: 12px; padding-bottom: 10px; }
      .composer-box textarea { max-height: 72px; }
    }

    /* Narrow phones: edge-to-edge. Wider viewports: 390px phone frame. */
    @media (min-width: 400px) {
      :root {
        --app-radius: 36px;
        --phone-border: 9px;
        --top-pad-extra: 22px;
        --bubble-max: min(82%, 280px);
        --space: 14px;
      }
      body {
        place-items: center;
        padding:
          max(16px, var(--safe-top))
          max(16px, var(--safe-right))
          max(16px, var(--safe-bottom))
          max(16px, var(--safe-left));
        overflow: auto;
        background:
          radial-gradient(900px 420px at 50% -12%, rgba(151, 71, 255, 0.16), transparent 55%),
          linear-gradient(180deg, #EDE8F5 0%, #F6F5F7 50%, #ECECEE 100%);
      }
      .shell {
        width: min(var(--shell-max), 100%);
        height: min(760px, calc(100dvh - 32px));
        min-height: 0;
        max-height: calc(100dvh - 32px);
      }
      .phone {
        box-shadow: 0 28px 64px rgba(40, 20, 80, 0.18);
        height: 100%;
      }
      .phone::before {
        display: block;
        content: "";
        position: absolute;
        top: 9px; left: 50%; transform: translateX(-50%);
        width: 88px; height: 20px;
        border-radius: 0 0 12px 12px;
        background: #141416;
        z-index: 30;
      }
      .partial-carousel {
        margin: 0;
        padding-left: 0;
        padding-right: 0;
      }
    }

    @media (min-width: 900px) {
      .shell {
        height: min(800px, calc(100dvh - 40px));
        max-height: calc(100dvh - 40px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="phone" aria-label="Taksitlio ihtiyaç asistanı">
      <div class="app" id="app">
        <canvas id="fx" aria-hidden="true"></canvas>
        <header class="top" id="top">
          <img class="wordmark" src="assets/logowithlabel.png" alt="taksitlio" />
          <div class="guest">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.6 0-6.75 1.8-6.75 4v1.25h13.5V18.25c0-2.2-3.15-4-6.75-4Z"/></svg>
            Misafir
          </div>
        </header>

        <div class="thread" id="thread" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-ai" aria-label="Taksitlio Yapay Zekâ">
              <span class="label">
                <span class="brand-line">taks<span class="pi">i</span>tl<span class="pi">i</span><span class="po">o</span></span>
                <span class="ai-line">yapay zekâ</span>
              </span>
            </div>
            <h1>Merhaba</h1>
            <p>Senin için ihtiyaç analizi yapayım mı?</p>
          </div>
        </div>

        <footer class="composer">
          <form id="form" autocomplete="off">
            <div class="composer-box">
              <textarea
                id="input"
                rows="1"
                maxlength="500"
                placeholder="Örn. cep telefonu, bütçem 40 bin…"
                aria-label="İhtiyaç prompt’u"
              ></textarea>
              <button class="send" id="send" type="submit" aria-label="Gönder">
                <svg viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l11 2-11 2z"/></svg>
              </button>
            </div>
          </form>
        </footer>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/public-facing.js?v=20260801a"></script>
  <script src="js/entity-logos.js?v=20260801a"></script>
  <script src="js/chat-cards.js?v=20260801a"></script>
  <script src="js/search-session/client.js?v=20260801b"></script>
  <script src="js/search-session/ui.js?v=20260801b"></script>
  <script src="js/search-progress/timeline.js?v=20260801a"></script>
  <script src="js/clarification/card.js?v=20260801a"></script>
  <script src="js/constraint-chips/chips.js?v=20260801a"></script>
  <script src="js/progressive-products/carousel.js?v=20260801a"></script>
  <script src="js/logo-progress-rail/rail.js?v=20260801a"></script>

  <script>
    const els = {
      app: document.getElementById("app"),
      fx: document.getElementById("fx"),
      top: document.getElementById("top"),
      thread: document.getElementById("thread"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      toast: document.getElementById("toast"),
    };

    let busy = false;
    let started = false;
    let particles = [];
    const COLORS = ["#9747FF", "#D8FF00", "#B370FF", "#FFFFFF", "#6C1ED0", "#E2C2FF"];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const searchUi = window.TaksitlioSearchUi
      ? window.TaksitlioSearchUi.attach({
          thread: els.thread,
          botBubble: (html) => botBubble(html),
          clearTyping: () => clearTyping(),
          onError: (msg) => {
            const safe =
              window.TaksitlioPublic && window.TaksitlioPublic.sanitize
                ? window.TaksitlioPublic.sanitize(msg)
                : msg;
            toast(safe);
            botBubble(safe);
          },
        })
      : null;

    function toast(msg) {
      const safe =
        window.TaksitlioPublic && window.TaksitlioPublic.sanitize
          ? window.TaksitlioPublic.sanitize(msg)
          : msg;
      els.toast.textContent = safe;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function flashApp() {
      if (reduceMotion) return;
      els.app.classList.remove("flash");
      void els.app.offsetWidth;
      els.app.classList.add("flash");
    }

    (function fxLoop() {
      const c = els.fx;
      const ctx = c.getContext("2d");
      function resize() {
        const r = els.app.getBoundingClientRect();
        c.width = Math.max(1, r.width) * devicePixelRatio;
        c.height = Math.max(1, r.height) * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }
      resize();
      window.addEventListener("resize", resize);

      function spawnConfetti(n = 42, power = 1) {
        if (reduceMotion) return;
        const w = c.width / devicePixelRatio;
        const h = c.height / devicePixelRatio;
        const cx = w * 0.5;
        const cy = h * 0.36;
        for (let i = 0; i < n; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (3 + Math.random() * 5.8) * power;
          particles.push({
            x: cx + (Math.random() - 0.5) * 24,
            y: cy + (Math.random() - 0.5) * 14,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.2 * power,
            life: 1,
            decay: 0.014 + Math.random() * 0.012,
            w: 4 + Math.random() * 7,
            h: 2 + Math.random() * 4,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.35,
            color: COLORS[(Math.random() * COLORS.length) | 0],
            shape: Math.random() > 0.55 ? "rect" : Math.random() > 0.5 ? "ribbon" : "dot",
          });
        }
      }

      window.__burst = (kind = "soft") => {
        if (kind === "big") {
          spawnConfetti(58, 1.15);
          flashApp();
        } else if (kind === "finale") {
          spawnConfetti(72, 1.25);
          setTimeout(() => spawnConfetti(28, 0.8), 90);
          flashApp();
        } else {
          spawnConfetti(28, 0.85);
        }
      };

      function tick() {
        const w = c.width / devicePixelRatio;
        const h = c.height / devicePixelRatio;
        ctx.clearRect(0, 0, w, h);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.vx *= 0.99;
          p.rot += p.vr;
          p.life -= p.decay;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(p.life, 0);
          ctx.fillStyle = p.color;
          if (p.shape === "dot") {
            ctx.beginPath();
            ctx.arc(0, 0, p.w * 0.35, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.shape === "ribbon") {
            ctx.fillRect(-p.w * 0.15, -p.h * 1.8, p.w * 0.3, p.h * 3.6);
          } else {
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          }
          ctx.restore();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    function scrollEnd() {
      requestAnimationFrame(() => {
        els.thread.scrollTop = els.thread.scrollHeight;
      });
    }

    function botBubble(html) {
      const safe =
        window.TaksitlioPublic && window.TaksitlioPublic.sanitize
          ? window.TaksitlioPublic.sanitize(html)
          : html;
      const row = document.createElement("div");
      row.className = "row bot";
      row.innerHTML = `
        <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
        <div class="bubble bot"><span class="who">Taksitlio</span>${safe}</div>`;
      els.thread.appendChild(row);
      scrollEnd();
      return row;
    }

    function userBubble(text) {
      const row = document.createElement("div");
      row.className = "row user";
      row.innerHTML = `<div class="bubble user"></div>`;
      row.querySelector(".bubble").textContent = text;
      els.thread.appendChild(row);
      scrollEnd();
      return row;
    }

    function typing() {
      const row = document.createElement("div");
      row.className = "row bot";
      row.dataset.typing = "1";
      row.innerHTML = `
        <div class="avatar"><img src="assets/favicon.png" alt="" /></div>
        <div class="bubble bot typing"><i></i><i></i><i></i></div>`;
      els.thread.appendChild(row);
      scrollEnd();
      return row;
    }

    function clearTyping() {
      els.thread.querySelectorAll('[data-typing="1"]').forEach((n) => n.remove());
    }

    function parse(text) {
      return { raw: (text || "").trim() };
    }

    const BOOT_EXAMPLES = [
      {
        label: "Telefon",
        text: "Cep telefonu alacağız, bütçemiz 40 bin TL civarı",
      },
      {
        label: "Beyaz eşya",
        text: "Buzdolabı bakıyorum, 25–30 bin",
      },
    ];

    function clearPromptSuggestions() {
      els.thread.querySelectorAll(".prompt-suggestions").forEach((n) => n.remove());
    }

    function showPromptSuggestions(examples) {
      clearPromptSuggestions();
      const wrap = document.createElement("div");
      wrap.className = "prompt-suggestions";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", "Örnek aramalar");
      examples.forEach((ex) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "suggest";
        btn.innerHTML =
          `<span class="suggest-label"></span><span class="suggest-text"></span>`;
        btn.querySelector(".suggest-label").textContent = ex.label;
        btn.querySelector(".suggest-text").textContent = ex.text;
        btn.addEventListener("click", () => {
          if (busy) return;
          clearPromptSuggestions();
          run(ex.text);
        });
        wrap.appendChild(btn);
      });
      els.thread.appendChild(wrap);
      scrollEnd();
      return wrap;
    }

    async function boot() {
      window.__burst("soft");
      const t = typing();
      await wait(520);
      t.remove();
      botBubble("Ne almak istediğini ve bütçeni kendi cümlelerinle yazman yeterli.");
      showPromptSuggestions(BOOT_EXAMPLES);
      started = true;
    }

    async function run(text) {
      if (busy) return;
      const need = parse(text);
      if (!need.raw) return;

      busy = true;
      els.send.disabled = true;
      els.input.value = "";
      els.input.style.height = "auto";
      clearPromptSuggestions();

      userBubble(need.raw);
      window.__burst("soft");
      const t = typing();
      try {
        if (searchUi) {
          await searchUi.runSearch(need.raw);
        } else {
          clearTyping();
          botBubble("NanobaseAI arama servisi şu an kullanılamıyor.");
        }
      } catch (err) {
        clearTyping();
        const safe =
          window.TaksitlioPublic && window.TaksitlioPublic.errorMessage
            ? window.TaksitlioPublic.errorMessage(err)
            : "NanobaseAI isteğini işlerken bir sorun oluştu. Lütfen tekrar dene.";
        toast(safe);
        botBubble(safe);
        console.error(err);
      }

      busy = false;
      els.send.disabled = false;
      els.input.focus();
    }

    function textareaMaxPx() {
      const short = window.matchMedia("(max-height: 560px)").matches;
      return short ? 72 : Math.min(Math.round(window.innerHeight * 0.3), 140);
    }

    function syncShellToViewport() {
      if (window.matchMedia("(min-width: 400px)").matches) {
        document.documentElement.style.removeProperty("--vvh");
        return;
      }
      const h =
        (window.visualViewport && window.visualViewport.height) ||
        window.innerHeight;
      document.documentElement.style.setProperty("--vvh", h + "px");
    }
    syncShellToViewport();
    window.addEventListener("resize", syncShellToViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncShellToViewport);
      window.visualViewport.addEventListener("scroll", syncShellToViewport);
    }

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      run(els.input.value);
    });
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        run(els.input.value);
      }
    });
    els.input.addEventListener("input", () => {
      const el = els.input;
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, textareaMaxPx()) + "px";
    });
    els.thread.addEventListener("scroll", () => {
      els.top.classList.toggle("scrolled", els.thread.scrollTop > 8);
    });

    boot().then(() => els.input.focus());
  </script>
</body>
</html>
