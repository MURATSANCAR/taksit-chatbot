name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration (Redis required)
        run: |
          pytest -q
          pytest -m integration tests/integration -q --tb=short
          # Dynamic catalog acceptance lives under tests/integration/semantic_matching
          # and is collected by the full suite above (not Redis-gated).
      - name: Validate evaluation datasets
        run: |
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/development/tr-category-dev.v1.jsonl \
            --check-split-integrity
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/golden/tr-category-validation.v1.jsonl
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/golden/tr-category-holdout.v1.jsonl
      - name: Smoke evaluation (tiny subset — non-blocking gate)
        run: |
          # Uses validation split, small sample; asserts report structure only.
          pytest tests/acceptance/evaluation -q --tb=short
