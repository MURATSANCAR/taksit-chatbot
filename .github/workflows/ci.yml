name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + Redis integration (required)
        run: |
          pytest -q --ignore=tests/integration
          pytest -m integration tests/integration/conversation_state tests/integration/redis -q --tb=short
          # Must not soft-skip Redis when service is up.
          out=$(pytest -m integration tests/integration/redis -q)
          echo "$out" | grep -E "[1-9][0-9]* skipped" && exit 1 || true
      - name: Validate evaluation datasets (v1 + v2 + v3 + v4)
        run: |
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/development/tr-category-dev.v1.jsonl \
            --check-split-integrity
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/golden/tr-category-validation.v1.jsonl
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/golden/tr-category-holdout.v1.jsonl
          # ADR-006 hardening datasets (DRAFT / synthetic; used with --gate-profile hardening).
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/development/tr-category-dev.v2.jsonl
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/validation/tr-category-validation.v2.jsonl
          # ADR-007 v3 acceptance datasets (contain ≥100 HUMAN_REVIEWED cases).
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/development/tr-category-dev.v3.jsonl
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/validation/tr-category-validation.v3.jsonl
          # ADR-008 v4 morphology / residual datasets.
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/development/tr-category-dev.v4.jsonl || true
          python -m taksitlio.evaluation.cli validate-dataset \
            --dataset evaluation/datasets/validation/tr-category-validation.v4.jsonl || true
      - name: Smoke evaluation + ADR-009 runtime gate unit tests
        run: |
          pytest tests/acceptance/evaluation tests/acceptance/runtime -q --tb=short
      - name: Real embedding challenger dry-run (must reject lexical fallback)
        run: |
          # Challenger exits non-zero when no real deployment is available;
          # we accept that here — the point is that it *never silently* passes
          # via a lexical fallback.
          set +e
          python -m taksitlio.evaluation.cli compare-embeddings --gateway lexical
          rc_lex=$?
          python -m taksitlio.evaluation.cli compare-embeddings --gateway unavailable
          rc_unavail=$?
          if [ "$rc_lex" = "0" ] || [ "$rc_unavail" = "0" ]; then
            echo "compare-embeddings must NOT return OK for lexical/unavailable gateways" >&2
            exit 1
          fi
      - name: Other non-Redis integration (fixture catalog etc.)
        run: |
          pytest -m integration tests/integration/semantic_matching tests/integration/evaluation -q --tb=short

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taksitlio
          POSTGRES_PASSWORD: taksitlio
          POSTGRES_DB: taksitlio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taksitlio -d taksitlio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGVECTOR_URL: postgres://taksitlio:taksitlio@127.0.0.1:5432/taksitlio
      INTEGRATION_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps (with psycopg for pgvector integration)
        run: pip install -e ".[dev]"
      - name: Bootstrap pgvector extension + poc embedding model
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$PGVECTOR_URL" -f db/bootstrap/poc-embedding-model.sql
      - name: pgvector integration (REQUIRED — must not skip)
        run: |
          out=$(pytest -m integration tests/integration/category_embedding tests/integration/pgvector -q --tb=short)
          echo "$out"
          echo "$out" | grep -E "[1-9][0-9]* skipped" && exit 1 || true
          echo "$out" | grep -E "[1-9][0-9]* passed"
