name: Evaluation (nightly / manual)

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  holdout-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run holdout evaluation (ADR-005 §6 — read-only gate)
        run: |
          python -m taksitlio.evaluation.cli run-category-eval \
            --dataset evaluation/datasets/golden/tr-category-holdout.v1.jsonl \
            --mode FULL \
            --workers 4
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdout-evaluation-reports
          path: evaluation/reports/
          if-no-files-found: warn
