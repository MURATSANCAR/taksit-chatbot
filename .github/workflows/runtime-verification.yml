name: Runtime Verification (ADR-009)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "src/taksitlio/runtime_verification/**"
      - "src/taksitlio/understanding/fast/**"
      - "src/taksitlio/embeddings/**"
      - "tests/integration/redis/**"
      - "tests/integration/pgvector/**"
      - "tests/integration/runtime/**"
      - "tests/acceptance/runtime/**"
      - "docker/docker-compose.runtime.yml"
      - ".github/workflows/runtime-verification.yml"

jobs:
  redis-pgvector:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taksitlio
          POSTGRES_PASSWORD: taksitlio
          POSTGRES_DB: taksitlio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taksitlio -d taksitlio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      PGVECTOR_URL: postgres://taksitlio:taksitlio@127.0.0.1:5432/taksitlio
      INTEGRATION_REQUIRE_REDIS: "1"
      INTEGRATION_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Redis integration (skip=0)
        run: |
          out=$(pytest -m integration tests/integration/redis -q --tb=short)
          echo "$out"
          echo "$out" | grep -E "skipped" && {
            echo "Redis integration must not skip" >&2
            # allow "0 skipped"
            echo "$out" | grep -E "[1-9][0-9]* skipped" && exit 1 || true
          }
          echo "$out" | grep -E "[1-9][0-9]* passed"
      - name: Bootstrap pgvector + embedding probe SQL
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$PGVECTOR_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql "$PGVECTOR_URL" -f db/bootstrap/poc-embedding-model.sql || true
      - name: pgvector integration (skip=0)
        run: |
          out=$(pytest -m integration tests/integration/pgvector tests/integration/category_embedding -q --tb=short)
          echo "$out"
          echo "$out" | grep -E "[1-9][0-9]* skipped" && exit 1 || true
          echo "$out" | grep -E "[1-9][0-9]* passed"
      - name: Acceptance runtime gates (unit)
        run: pytest tests/acceptance/runtime -q --tb=short
      - name: Write P1 dependency reports
        run: python evaluation/_run_adr008_p1.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: adr008-p1-reports
          path: evaluation/reports/adr008-p1-*.json

  real-runtime-smoke:
    runs-on: ubuntu-latest
    # Only runs when secrets / vars point at a live OpenAI-compatible stack.
    if: ${{ vars.FAST_PROVIDER_BASE_URL != '' && vars.EMBEDDING_PROVIDER_BASE_URL != '' }}
    env:
      FAST_PROVIDER_BASE_URL: ${{ vars.FAST_PROVIDER_BASE_URL }}
      FAST_MODEL_REFERENCE: ${{ vars.FAST_MODEL_REFERENCE }}
      EMBEDDING_PROVIDER_BASE_URL: ${{ vars.EMBEDDING_PROVIDER_BASE_URL }}
      EMBEDDING_MODEL_REFERENCE: ${{ vars.EMBEDDING_MODEL_REFERENCE }}
      EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM }}
      REDIS_URL: redis://127.0.0.1:6379/15
      PGVECTOR_URL: postgres://taksitlio:taksitlio@127.0.0.1:5432/taksitlio
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taksitlio
          POSTGRES_PASSWORD: taksitlio
          POSTGRES_DB: taksitlio
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Real FAST + embedding smoke (no lexical fallback)
        run: |
          python - <<'PY'
          import asyncio, os
          from taksitlio.understanding.fast.remote import build_remote_fast_from_env
          from taksitlio.embeddings.strict_client import build_strict_embedder_from_env

          async def main():
              fast = build_remote_fast_from_env()
              emb = build_strict_embedder_from_env()
              outcome = await fast.extract("telefon arıyorum")
              assert outcome.need_profile
              vectors = await emb.embed(["telefon"])
              assert vectors and len(vectors[0]) == int(os.environ["EMBEDDING_DIM"])
              await fast.aclose(); await emb.aclose()
          asyncio.run(main())
          PY
