# 9B NeedProfile LoRA on CPU (nanobase). Expect multi-hour / multi-day runs.
# Requires HuggingFace transformers weights, not GGUF.
# Hub id matches serve family: Qwen/Qwen3.5-9B (GGUF remain for llama.cpp).

base_model_ref: "Qwen/Qwen3.5-9B"
output_dir: "training/exports/lora-out-9b-cpu"
train_jsonl: "training/exports/need_profile_sft.v2.jsonl"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs: 1
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_len: 1024
  bf16: false
  logging_steps: 10
  save_steps: 50
  max_steps: 200

runtime:
  require_gpu: false
  framework: "peft+transformers"

notes:
  - "First overnight pass uses max_steps=200 on v2 SFT (~2k rows)"
  - "Serving GGUF (poc-fast-nine-b) remains separate until adapter is converted/wired"
  - "Do not claim QUALITY_READY until ADR-009 HR100 eval passes"
