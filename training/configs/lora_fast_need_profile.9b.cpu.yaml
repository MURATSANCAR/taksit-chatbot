# 9B NeedProfile LoRA on CPU (nanobase). Expect multi-hour / multi-day runs.
# Requires HuggingFace transformers weights, not GGUF.
# Example HF id (ops may mirror locally): Qwen/Qwen3.5-9B or org-equivalent opaque ref.

base_model_ref: "Qwen/Qwen3.5-9B"
output_dir: "training/exports/lora-out-9b-cpu"
train_jsonl: "training/exports/need_profile_sft.jsonl"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

train:
  epochs: 1
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_len: 2048
  bf16: false
  logging_steps: 10
  save_steps: 100
  # omit max_steps → full epoch over JSONL

runtime:
  require_gpu: false
  framework: "peft+transformers"

notes:
  - "CPU 9B is intentional slow path until a GPU host exists"
  - "Do not claim QUALITY_READY until ADR-009 HR100 eval passes"
