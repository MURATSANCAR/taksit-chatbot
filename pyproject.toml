[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taksitlio-chatbot"
version = "0.2.0"
description = "Taksitlio chatbot — gerçek zamanlı Türkçe anlama + kampanya öneri"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "asyncpg>=0.29",
  "redis>=5.0",
  "eval_type_backport>=0.2; python_version<'3.10'",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "asyncpg>=0.29",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "Pillow>=10.0",
  "eval_type_backport>=0.2; python_version<'3.10'",
]
media = [
  "Pillow>=10.0",
  "httpx>=0.27",
]
storage = [
  "boto3>=1.34",
]
crawler = [
  "cloudscraper>=1.2",
  "playwright>=1.40",
  "curl_cffi>=0.7",
]

[project.scripts]
taksitlio-api = "taksitlio.main:app"
taksitlio-scheduler = "taksitlio.ingestion_scheduler.daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taksitlio = ["schemas/*.json", "conversation_state/lua/*.lua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires external Redis and/or PostgreSQL/pgvector (set REDIS_URL / PGVECTOR_URL)",
]